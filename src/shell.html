<title>Massive Armies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&display=swap">
<style>
/* Command table: full-bleed 3D battlefield with brass-trimmed slate rails at top and bottom; sheets slide up for council and battle selection. */
:root{
  color-scheme: dark;
  --ink:#0c1115; --panel:rgba(14,20,25,.9); --solid:#131a20; --raise:#1b242b; --raise2:#232e36;
  --line:rgba(212,168,74,.22); --line2:rgba(236,230,216,.09);
  --fg:#ece6d8; --muted:#a2aaa9; --dim:#6f797c;
  --brass:#d4a84a; --brass-hi:#e8c26a; --brass-ink:#1a1407;
  --blue:#5585ee; --red:#e5533f; --good:#74c690; --warn:#e8b34a;
  --f-display:'Big Shoulders Stencil','Big Shoulders Stencil Display','Barlow Condensed',Impact,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,sans-serif;
  --dock-h:0px; --top-h:56px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ink)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hudtext{font-family:var(--f-ui);letter-spacing:.04em}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;min-height:36px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--raise);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--raise2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.tool:focus-visible,.tab:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:#f0d48a55;font-weight:700}
.btn.primary:hover{background:linear-gradient(180deg,#f2d07c,var(--brass-hi))}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb4a8;border-color:#e5533f44}
.btn.on{border-color:var(--brass);background:#2a2618;color:var(--brass-hi)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.sm{min-height:30px;font-size:12.5px;padding:0 9px}
.btn svg{width:18px;height:18px}
.btn.icon{width:34px;padding:0}
.btn.icon.muted{color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg .btn{border:0;border-radius:0;min-width:40px;background:transparent}
.seg .btn+.btn{border-left:1px solid var(--line2)}
.seg .btn.on{background:#2a2618}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(9,13,16,.82),rgba(9,13,16,.55) 70%,rgba(9,13,16,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;color:var(--fg);white-space:nowrap}
.wordmark b{color:var(--brass)}
.modeline{font-family:var(--f-ui);font-size:13px;letter-spacing:.05em;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.strength{flex:1 1 220px;display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto;order:2}
.strength .num{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:52px;font-variant-numeric:tabular-nums}
.strength .num.b{color:var(--blue);text-align:right}
.strength .num.r{color:var(--red)}
.sbar{flex:1;height:8px;border-radius:4px;background:#00000066;display:flex;overflow:hidden;border:1px solid var(--line2)}
.sbar i{display:block;height:100%;transition:width .3s}
.sbar i.b{background:var(--blue)} .sbar i.r{background:var(--red);margin-left:auto}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;order:3}
.gold{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--brass-hi);font-variant-numeric:tabular-nums;padding:0 4px}
.gold .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a6,var(--brass) 55%,#8a6420);box-shadow:0 0 0 1px #00000055}
.gold small{font-family:var(--f-ui);font-size:13px;color:var(--good);font-weight:600}
@media (max-width:700px){ .strength{order:5;flex-basis:100%;max-width:none} .wordmark{font-size:19px} }

/* ---------- minimap ---------- */
.minimap{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) + 4px);width:180px;height:108px;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 22px #0007;background:#0008;cursor:pointer}
.minimap canvas{width:100%;height:100%;display:block}
@media (max-width:700px){ .minimap{width:120px;height:72px} }

/* ---------- docks ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap{flex-wrap:wrap}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;min-width:0;flex:1}
.scroller::-webkit-scrollbar{display:none}
.unit-info{font-family:var(--f-ui);font-size:13.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.unit-info b{color:var(--fg);font-weight:600}
.unit-info .k{color:var(--dim);margin-left:8px}
.chip{flex:0 0 auto;width:74px;min-height:62px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 2px;color:var(--blue)}
.chip.red{color:var(--red)}
.chip .nm{font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.02em;color:var(--fg);line-height:1.05;text-align:center;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.chip .ct{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--brass);background:#262418;box-shadow:inset 0 0 0 1px #d4a84a55}
.chip.empty{opacity:.45}
.uicon{width:24px;height:24px;display:block}
.tool{flex:0 0 auto;min-width:50px;height:46px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);padding:0 4px}
.tool svg{width:21px;height:21px}
.tool span{font-family:var(--f-ui);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tool:hover{color:var(--fg)}
.tool.on{color:var(--brass-hi);border-color:var(--line);background:#24221a}
.swatch{width:20px;height:14px;border-radius:3px;border:1px solid #0006}
.cap{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap b{color:var(--fg);font-weight:600}
.cap .full{color:var(--warn)}
.cap .bar{display:block;height:3px;border-radius:2px;background:#ffffff14;margin-top:3px;overflow:hidden}
.cap .bar i{display:block;height:100%;background:var(--brass)}
.spacer{flex:1}
.fight{min-height:44px;padding:0 22px;font-size:17px}
.collapse-btn{width:34px;padding:0}

/* ---------- floating cards ---------- */
.card{position:fixed;z-index:18;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px #0008;padding:10px 12px}
.inspect{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h) + 10px);width:min(260px,calc(100vw - 32px))}
.inspect h4,.grouppanel h4,.pop h4{margin:0;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.meter{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden;margin:3px 0 7px}
.meter i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.03em}
.kv b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.x{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;width:30px;height:30px;border-radius:6px}
.x:hover{background:#ffffff10;color:var(--fg)}
.grouppanel{left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 10px);width:min(470px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.pop{position:fixed;z-index:22;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h) + 10px);width:min(320px,calc(100vw - 32px));background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 12px 36px #000a;display:flex;flex-direction:column;gap:10px}
.pop.top{top:calc(var(--top-h) + 8px);bottom:auto;z-index:24}
.slider{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.slider output{color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brass)}
.stats{right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) + 122px);width:min(300px,calc(100vw - 32px));max-height:calc(100% - var(--top-h) - var(--dock-h) - 140px);overflow:auto}
@media (max-width:700px){ .stats{top:calc(var(--top-h) + 84px);max-height:calc(100% - var(--top-h) - var(--dock-h) - 100px)} }
table.cas{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:13.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
table.cas th{font-weight:600;color:var(--dim);text-align:right;padding:3px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
table.cas th:first-child,table.cas td:first-child{text-align:left}
table.cas td{padding:3px 4px;text-align:right;border-top:1px solid var(--line2);color:var(--muted)}
table.cas td.nm{color:var(--fg);display:flex;align-items:center;gap:6px}
table.cas td .uicon{width:16px;height:16px}
.toast{position:fixed;z-index:40;left:50%;top:calc(var(--top-h) + 12px);transform:translateX(-50%);background:var(--solid);border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:9px;font-family:var(--f-ui);font-size:15px;letter-spacing:.04em;box-shadow:0 10px 30px #000a;max-width:calc(100vw - 32px);text-align:center}
.badge{position:fixed;z-index:16;left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--top-h) + 4px);font-family:var(--f-ui);font-size:12px;color:var(--warn);background:#0009;border:1px solid #e8b34a44;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.banner{position:fixed;z-index:17;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-size:clamp(40px,9vw,92px);letter-spacing:.04em;text-shadow:0 4px 30px #000c;pointer-events:none;white-space:nowrap}

/* ---------- modal sheets ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px #000c;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:700px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:90%;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.03em;line-height:1;text-wrap:balance}
.sheet-h .sub{font-family:var(--f-ui);color:var(--muted);font-size:14px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--brass-hi);border-bottom-color:var(--brass)}
.lede{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:62ch}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise)}
.lrow.locked{opacity:.5}
.lrow .no{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--brass);text-align:center;font-variant-numeric:tabular-nums}
.lrow .t{font-family:var(--f-ui);font-weight:600;font-size:17px;letter-spacing:.03em;min-width:0}
.lrow .m{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.lrow .won{color:var(--good)}
.field{display:flex;flex-direction:column;gap:5px;font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],textarea{font-family:var(--f-body);font-size:15px;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:15px;letter-spacing:.03em;color:var(--fg)}
.check input{width:18px;height:18px;accent-color:var(--brass)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* recruit */
.rec{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise);color:var(--blue)}
.rec .uicon{width:30px;height:30px}
.rec .t{font-family:var(--f-ui);font-weight:600;font-size:16px;color:var(--fg);letter-spacing:.03em}
.rec .t small{color:var(--dim);font-weight:500;margin-left:6px;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px}
.rec .st{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);letter-spacing:.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.rec .own{font-family:var(--f-ui);font-size:13px;color:var(--muted);text-align:right;margin-bottom:4px;font-variant-numeric:tabular-nums}
.rec .own b{color:var(--fg);font-size:16px}
.rec .buy{display:flex;gap:5px;justify-content:flex-end}
/* tech tree */
.tree{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.branch h5{margin:0 0 8px;font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.node{position:relative;border:1px solid var(--line2);border-radius:9px;background:var(--raise);padding:8px 10px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.node+.node::before{content:"";position:absolute;left:18px;top:-15px;width:2px;height:14px;background:var(--line2)}
.node.owned{border-color:#74c69055;background:#1a2620}
.node.owned+.node::before{background:#74c69088}
.node.avail{border-color:var(--line)}
.node.locked{opacity:.55}
.node .nt{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.03em;display:flex;align-items:center;gap:6px;color:var(--fg)}
.node .nt .uicon{width:18px;height:18px;color:var(--blue)}
.node .nd{font-size:12.5px;color:var(--muted);line-height:1.35}
.node .req{font-family:var(--f-ui);font-size:12px;color:var(--dim);letter-spacing:.03em}
.node .ok{font-family:var(--f-ui);font-size:12.5px;color:var(--good);letter-spacing:.05em;text-transform:uppercase}
/* upgrades */
.ucat h5{margin:4px 0 6px;font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.urow .t{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.03em}
.urow .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.03em}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:#ffffff18}
.pips i.f{background:var(--brass)}
/* results */
.result-title{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,10vw,72px);line-height:.95;letter-spacing:.03em;margin:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--raise)}
.stat .l{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.goldlines{display:flex;flex-direction:column;gap:4px;font-family:var(--f-ui);font-size:15px;letter-spacing:.03em}
.goldlines div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line2);padding-bottom:3px;color:var(--muted)}
.goldlines div b{color:var(--brass-hi);font-variant-numeric:tabular-nums}
.goldlines div.total{color:var(--fg);border:0;font-size:17px}
.welcome-mark{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,11vw,76px);line-height:.9;letter-spacing:.02em;margin:0}
.welcome-mark span{color:var(--brass)}
.hint{font-family:var(--f-ui);font-size:13.5px;letter-spacing:.04em;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.03em}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--blue)}
.legend span em{font-style:normal;color:var(--muted)}
.legend .uicon{width:18px;height:18px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c2d" hidden></canvas>
</div>

<header class="topbar">
  <div class="brand"><div class="wordmark">MASSIVE <b>ARMIES</b></div><div class="modeline" id="modeLine">Loading the battlefield</div></div>
  <div class="strength" aria-label="Army strength">
    <span class="num b" id="sBlue">0</span>
    <div class="sbar"><i class="b" id="barB" style="width:50%"></i><i class="r" id="barR" style="width:50%"></i></div>
    <span class="num r" id="sRed">0</span>
  </div>
  <div class="top-actions">
    <div class="gold" title="Gold"><span class="coin"></span><span id="goldNum">0</span><small id="goldPend"></small></div>
