<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Massive Armies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&display=swap">
<style>
/* Command table: full-bleed 3D battlefield with brass-trimmed slate rails at top and bottom; sheets slide up for council and battle selection. */
:root{
  color-scheme: dark;
  --ink:#0c1115; --panel:rgba(14,20,25,.9); --solid:#131a20; --raise:#1b242b; --raise2:#232e36;
  --line:rgba(212,168,74,.22); --line2:rgba(236,230,216,.09);
  --fg:#ece6d8; --muted:#a2aaa9; --dim:#6f797c;
  --brass:#d4a84a; --brass-hi:#e8c26a; --brass-ink:#1a1407;
  --blue:#5585ee; --red:#e5533f; --good:#74c690; --warn:#e8b34a;
  --f-display:'Big Shoulders Stencil','Big Shoulders Stencil Display','Barlow Condensed',Impact,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,sans-serif;
  --dock-h:0px; --top-h:56px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ink)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage #ov{pointer-events:none}
.hudtext{font-family:var(--f-ui);letter-spacing:.04em}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;min-height:36px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--raise);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--raise2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.tool:focus-visible,.tab:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:#f0d48a55;font-weight:700}
.btn.primary:hover{background:linear-gradient(180deg,#f2d07c,var(--brass-hi))}
.btn.ghost{background:transparent}
.resetrow{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.resetrow .hint{flex:1}
.btn.danger.armed{background:#e5533f;color:#fff;border-color:#e5533f}
.btn.danger{color:#ffb4a8;border-color:#e5533f44}
.btn.on{border-color:var(--brass);background:#2a2618;color:var(--brass-hi)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.sm{min-height:30px;font-size:12.5px;padding:0 9px}
.btn svg{width:18px;height:18px}
.btn.icon{width:34px;padding:0}
.btn.icon.muted{color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg .btn{border:0;border-radius:0;min-width:40px;background:transparent}
.seg .btn+.btn{border-left:1px solid var(--line2)}
.seg .btn.on{background:#2a2618}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(9,13,16,.82),rgba(9,13,16,.55) 70%,rgba(9,13,16,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;color:var(--fg);white-space:nowrap}
.wordmark b{color:var(--brass)}
.modeline{font-family:var(--f-ui);font-size:13px;letter-spacing:.05em;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.strength{flex:1 1 220px;display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto;order:2}
.strength .num{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:52px;font-variant-numeric:tabular-nums}
.strength .num.b{color:var(--blue);text-align:right}
.strength .num.r{color:var(--red)}
.sbar{flex:1;height:8px;border-radius:4px;background:#00000066;display:flex;overflow:hidden;border:1px solid var(--line2)}
.sbar i{display:block;height:100%;transition:width .3s}
.sbar i.b{background:var(--blue)} .sbar i.r{background:var(--red);margin-left:auto}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;order:3}
.gold{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--brass-hi);font-variant-numeric:tabular-nums;padding:0 4px}
.gold .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a6,var(--brass) 55%,#8a6420);box-shadow:0 0 0 1px #00000055}
.gold small{font-family:var(--f-ui);font-size:13px;color:var(--good);font-weight:600}
@media (max-width:700px){ .strength{order:5;flex-basis:100%;max-width:none} .wordmark{font-size:19px} }

/* ---------- minimap ---------- */
.minimap{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) + 4px);width:180px;height:108px;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 22px #0007;background:#0008;cursor:pointer}
.minimap canvas{width:100%;height:100%;display:block}
@media (max-width:700px){ .minimap{width:120px;height:72px} }

/* ---------- docks ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap{flex-wrap:wrap}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;min-width:0;flex:1}
.scroller::-webkit-scrollbar{display:none}
.unit-info{font-family:var(--f-ui);font-size:13.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.unit-info b{color:var(--fg);font-weight:600}
.unit-info .k{color:var(--dim);margin-left:8px}
.chip{flex:0 0 auto;width:74px;min-height:62px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 2px;color:var(--blue)}
.chip.red{color:var(--red)}
.chip .nm{font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.02em;color:var(--fg);line-height:1.05;text-align:center;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.chip .ct{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip-l{flex:0 0 auto;align-self:center;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg)}
.otile{flex:0 0 auto;width:86px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px 4px;color:var(--blue);position:relative}
.otile.red{color:var(--red)}
.otile.on{border-color:var(--brass);background:#262418}
.otile .rk{position:absolute;top:3px;left:6px;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--brass)}
.otile .pick{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:0;width:100%}
.otile .nm{font-family:var(--f-ui);font-weight:600;font-size:12px;color:var(--fg);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otile .ct{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.otile .mv{display:flex;gap:4px;margin-top:2px}
.otile .mv button{width:32px;height:24px;border-radius:5px;border:1px solid var(--line2);background:var(--raise2);color:var(--fg);cursor:pointer;font-size:14px;line-height:1}
.otile .mv button:disabled{opacity:.3;cursor:default}
.ftile{flex:0 0 auto;min-width:64px;height:52px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);padding:0 6px}
.ftile svg{width:26px;height:26px}
.ftile span{font-family:var(--f-ui);font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.ftile:hover{color:var(--fg)}
.fplan{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;gap:2px;padding:0 8px;font-size:12px;color:var(--muted);max-width:240px}.fplan.wide{max-width:none;flex:1;min-width:0;padding:4px 2px}.fplan .fo{color:var(--fg);font-size:12.5px}
.fplan b{color:var(--brass-hi);font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ftile.on{color:var(--brass-hi);border-color:var(--line);background:#24221a}
.vsep{flex:0 0 1px;align-self:stretch;background:var(--line2);margin:4px 4px}
.cchip{flex:0 0 auto;display:grid;grid-template-columns:auto auto auto;align-items:center;gap:2px 4px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);padding:4px 6px;color:var(--blue)}
.cchip.red{color:var(--red)}
.cchip .nm{grid-column:1/-1;display:flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:600;font-size:12px;color:var(--fg);white-space:nowrap}
.cchip .nm .uicon{width:16px;height:16px}
.cchip button{width:26px;height:24px;border-radius:5px;border:1px solid var(--line2);background:var(--raise2);color:var(--fg);cursor:pointer;font-size:15px;line-height:1}
.cchip input{width:62px;padding:3px 4px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.fill{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.fill select,.fill input{width:auto;padding:5px 6px;font-size:13px}
.fill input{width:74px}
.chip.on{border-color:var(--brass);background:#262418;box-shadow:inset 0 0 0 1px #d4a84a55}
.chip.empty{opacity:.45}
.uicon{width:24px;height:24px;display:block}
.tool{flex:0 0 auto;min-width:50px;height:46px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);padding:0 4px}
.tool svg{width:21px;height:21px}
.tool span{font-family:var(--f-ui);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tool:hover{color:var(--fg)}
.tool.on{color:var(--brass-hi);border-color:var(--line);background:#24221a}
.swatch{width:20px;height:14px;border-radius:3px;border:1px solid #0006}
.cap{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap b{color:var(--fg);font-weight:600}
.cap .full{color:var(--warn)}
.cap .bar{display:block;height:3px;border-radius:2px;background:#ffffff14;margin-top:3px;overflow:hidden}
.cap .bar i{display:block;height:100%;background:var(--brass)}
.spacer{flex:1}
.fight{min-height:44px;padding:0 22px;font-size:17px}
.collapse-btn{width:34px;padding:0}

/* ---------- floating cards ---------- */
.card{position:fixed;z-index:18;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px #0008;padding:10px 12px}
.inspect{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h) + 10px);width:min(260px,calc(100vw - 32px))}
.inspect h4,.grouppanel h4,.pop h4{margin:0;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.meter{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden;margin:3px 0 7px}
.meter i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.03em}
.kv b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.x{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;width:30px;height:30px;border-radius:6px}
.x:hover{background:#ffffff10;color:var(--fg)}
.grouppanel{left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--top-h) + 8px);width:min(430px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.pop{position:fixed;z-index:22;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h) + 10px);width:min(320px,calc(100vw - 32px));background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 12px 36px #000a;display:flex;flex-direction:column;gap:10px}
.pop.top{top:calc(var(--top-h) + 8px);bottom:auto;z-index:24}
.slider{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.slider output{color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brass)}
.stats{right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) + 122px);width:min(300px,calc(100vw - 32px));max-height:calc(100% - var(--top-h) - var(--dock-h) - 140px);overflow:auto}
@media (max-width:700px){ .stats{top:calc(var(--top-h) + 84px);max-height:calc(100% - var(--top-h) - var(--dock-h) - 100px)} }
table.cas{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:13.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
table.cas th{font-weight:600;color:var(--dim);text-align:right;padding:3px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
table.cas th:first-child,table.cas td:first-child{text-align:left}
table.cas thead tr+tr th:first-child{text-align:right}
table.cas th[colspan]{text-align:center;border-bottom:1px solid var(--line2)}
table.cas .b{color:var(--blue)} table.cas .r{color:var(--red)}
table.cas td.k{color:var(--fg)}
table.cas tfoot td{color:var(--fg);font-weight:600}
table.cas tfoot tr+tr td{color:var(--muted);font-weight:400}
table.cas td{padding:3px 4px;text-align:right;border-top:1px solid var(--line2);color:var(--muted)}
table.cas td.nm{color:var(--fg);display:flex;align-items:center;gap:6px}
table.cas td .uicon{width:16px;height:16px}
.toast{position:fixed;z-index:40;left:50%;top:calc(var(--top-h) + 12px);transform:translateX(-50%);background:var(--solid);border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:9px;font-family:var(--f-ui);font-size:15px;letter-spacing:.04em;box-shadow:0 10px 30px #000a;max-width:calc(100vw - 32px);text-align:center}
.badge{position:fixed;z-index:16;left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--top-h) + 4px);font-family:var(--f-ui);font-size:12px;color:var(--warn);background:#0009;border:1px solid #e8b34a44;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.banner{position:fixed;z-index:17;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-size:clamp(40px,9vw,92px);letter-spacing:.04em;text-shadow:0 4px 30px #000c;pointer-events:none;white-space:nowrap}

/* ---------- modal sheets ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px #000c;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:700px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:90%;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
}
.sheet>*{flex-shrink:0}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.03em;line-height:1;text-wrap:balance}
.sheet-h .sub{font-family:var(--f-ui);color:var(--muted);font-size:14px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--brass-hi);border-bottom-color:var(--brass)}
.lede{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:62ch}
.list{display:flex;flex-direction:column;gap:6px}
.sb-h{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.sb-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise)}
.sb-row .t{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.03em}
.sb-row .m{font-size:12.5px;color:var(--muted);margin-top:2px}.sb-row .src{color:var(--dim)}
.sb-play{min-width:38px;font-size:14px}.sb-v{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.sb-v .btn{min-width:30px;padding:0 6px}
@media (max-width:560px){.sb-row{grid-template-columns:auto 1fr}.sb-v{grid-column:1/-1;justify-content:flex-start}}
.lrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise)}
.lrow.locked{opacity:.5}
.lrow .no{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--brass);text-align:center;font-variant-numeric:tabular-nums}
.lrow .t{font-family:var(--f-ui);font-weight:600;font-size:17px;letter-spacing:.03em;min-width:0}
.lrow .m{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.lrow .won{color:var(--good)}
.field{display:flex;flex-direction:column;gap:5px;font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],textarea{font-family:var(--f-body);font-size:15px;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:15px;letter-spacing:.03em;color:var(--fg)}
.check input{width:18px;height:18px;accent-color:var(--brass)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* recruit */
.rec{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise);color:var(--blue)}
.rec .uicon{width:30px;height:30px}
.rec .t{font-family:var(--f-ui);font-weight:600;font-size:16px;color:var(--fg);letter-spacing:.03em}
.rec .t small{color:var(--dim);font-weight:500;margin-left:6px;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px}
.rec .st{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);letter-spacing:.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.rec .own{font-family:var(--f-ui);font-size:13px;color:var(--muted);text-align:right;margin-bottom:4px;font-variant-numeric:tabular-nums}
.rec .own b{color:var(--fg);font-size:16px}
.rec .buy{display:flex;gap:5px;justify-content:flex-end}
/* tech tree */
.tree{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.branch h5{margin:0 0 8px;font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.node{position:relative;border:1px solid var(--line2);border-radius:9px;background:var(--raise);padding:8px 10px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.node+.node::before{content:"";position:absolute;left:18px;top:-15px;width:2px;height:14px;background:var(--line2)}
.node.owned{border-color:#74c69055;background:#1a2620}
.node.owned+.node::before{background:#74c69088}
.node.avail{border-color:var(--line)}
.node.locked{opacity:.55}
.node .nt{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.03em;display:flex;align-items:center;gap:6px;color:var(--fg)}
.node .nt .uicon{width:18px;height:18px;color:var(--blue)}
.node .nd{font-size:12.5px;color:var(--muted);line-height:1.35}
.node .nd b.up{color:var(--brass-hi);font-weight:600}
.node .req{font-family:var(--f-ui);font-size:12px;color:var(--dim);letter-spacing:.03em}
.node .ok{font-family:var(--f-ui);font-size:12.5px;color:var(--good);letter-spacing:.05em;text-transform:uppercase}
/* upgrades */
.ucat h5{margin:4px 0 6px;font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.urow .t{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.03em}
.urow .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.03em}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:#ffffff18}
.pips i.f{background:var(--brass)}
/* results */
.result-title{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,10vw,72px);line-height:.95;letter-spacing:.03em;margin:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--raise)}
.stat .l{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.goldlines{display:flex;flex-direction:column;gap:4px;font-family:var(--f-ui);font-size:15px;letter-spacing:.03em}
.goldlines div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line2);padding-bottom:3px;color:var(--muted)}
.goldlines div b{color:var(--brass-hi);font-variant-numeric:tabular-nums}
.desert{font-family:var(--f-ui);font-size:14px;letter-spacing:.03em;color:var(--warn)}
.goldlines div.total{color:var(--fg);border:0;font-size:17px}
.welcome-mark{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,11vw,76px);line-height:.9;letter-spacing:.02em;margin:0}
.welcome-mark span{color:var(--brass)}
.hint{font-family:var(--f-ui);font-size:13.5px;letter-spacing:.04em;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.03em}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--blue)}
.legend span em{font-style:normal;color:var(--muted)}
.legend .uicon{width:18px;height:18px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

/* ================= DATA: units, tech, maps, army generation ================= */

let rnd = mulberry32(12345);
function seedRng(s){ rnd = mulberry32(s>>>0); }
function gauss(){ return (rnd()+rnd()+rnd()+rnd()-2)*1.732; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const TAU=Math.PI*2;
function angDiff(a,b){ let d=(b-a)%TAU; if(d>Math.PI) d-=TAU; else if(d<-Math.PI) d+=TAU; return d; }

/* ---------- World ---------- */

const X0=-150*MS, X1=150*MS, Z0=-90*MS, Z1=90*MS;

const SPEEDK=new Float32Array(TERRAIN.map(t=>t.speed));

/* ---------- Units ---------- */
// cls: inf rng cav sie sup.  ucat: upgrade category
const UNITS=[
 {id:'sword', name:'Swordsmen', cls:'inf', hp:100,armor:3, dmg:14,aps:1.0, speed:3.2,range:0.9,morale:60, cost:10, r:.42,sp:1.1,mass:1,  scale:1,   foot:.55, role:'Line infantry', desc:'Reliable all-rounders for the main battle line.'},

 {id:'heavy', name:'Heavy Infantry',cls:'inf',hp:230,armor:10,dmg:20,aps:0.7,speed:2.2,range:1.0,morale:85, cost:30, r:.50,sp:1.3,mass:1.8,scale:1.15,foot:.65, role:'Armoured front', desc:'Slow, heavily armoured troops that anchor the line.'},

 {id:'log4',b:5,name:'Logistics IV',cost:6000,req:['log3'],cap:2000},
 {id:'log5',b:5,name:'Logistics V',cost:16000,req:['log4'],cap:4000},
 {id:'log6',b:5,name:'Logistics VI',cost:42000,req:['log5'],cap:8000},

];

// lv(cat,stat)->level ; ab: {abilityId:true}
function computeStats(lv, ab){
  return UNITS.map(u=>{
    const c=u.ucat, s=Object.assign({},u);
    s.hp=u.hp*(1+0.12*lv(c,'hp'));
    s.armor=u.armor+1.5*lv(c,'arm');
    s.dmg=u.dmg*(1+0.10*lv(c,'dmg'));
    s.cdT=1/(u.aps*(1+0.08*lv(c,'aps')));
    s.speed=u.speed*(1+0.05*lv(c,'spd'));
    if(ab.firearrows && (u.id==='archer'||u.id==='xbow')) s.dmg*=1.3;
    s.charge=(u.charge||0)*(ab.thunder?1.5:1);
    s.aoe=(u.aoe||0)*(ab.shells?1.4:1);
    s.aura=u.aura?u.aura*(ab.hymn?1.5:1):0;
    s.heal=u.heal?u.heal*(ab.surgery?2:1):0;
    s.sense=u.sense||(u.isR?u.range:9);
    s.pen=u.pen||0; s.minR=u.minR||0;
    return s;
  });
}

const BATTLE_NAMES={grassland:'Wheatmere Plain',hills:'Crowsback Heights',forest:'Thornwald',river:'Fords of Avel',pass:'Iron Gate Pass',desert:'Saltglass Waste',fortress:'Bastion of Kael',blank:'Proving Ground'};

function makeNoise(seed){
  const R=mulberry32(seed), P=new Uint8Array(512), p=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=(R()*(i+1))|0; [p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<512;i++) P[i]=p[i&255];
  const V=new Float32Array(256); for(let i=0;i<256;i++) V[i]=R();
  const val=(x,z)=>V[P[P[x&255]+(z&255)]];
  function n2(x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi; const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
    const a=val(xi,zi), b=val(xi+1,zi), c=val(xi,zi+1), d=val(xi+1,zi+1); return lerp(lerp(a,b,u),lerp(c,d,u),v); }
  function fbm(x,z,o=4){ let s=0,a=0.5,f=1,t=0; for(let i=0;i<o;i++){s+=n2(x*f,z*f)*a; t+=a; a*=0.5; f*=2.03;} return s/t; }
  return {n2,fbm};
}

function newTerrain(){ return {h:new Float32Array((TW+1)*(TH+1)), k:new Uint8Array(TW*TH), own:new Int8Array(TW*TH).fill(-1), bld:new Uint8Array(TW*TH), theme:'grass', id:'blank', ver:0}; }

const FORT_GATES=[-40,0,40], FORT_X=45;   // design units
const FORT_WX=FORT_X*MS, FORT_BACK=FORT_X*MS+5-34;   // real wall x, and how far a defending army sits behind its front line
function genMap(id, seed, opt={}){
  const T=newTerrain(); T.id=id; T.theme=(id==='desert')?'desert':'grass';
  const N=makeNoise(seed), R=mulberry32(seed^0x9e37);
  const VW=TW+1;
  // design coordinates of vertices and cell centres
  const vx=i=>(X0+i*TC)/MS, vz=j=>(Z0+j*TC)/MS;
  const cx=i=>(X0+(i+.5)*TC)/MS, cz=j=>(Z0+(j+.5)*TC)/MS;
  const bld=(x,z,size)=>placeBuilding(T,x*MS,z*MS,size);
  const setH=(f)=>{ for(let j=0;j<=TH;j++) for(let i=0;i<=TW;i++){ T.h[j*VW+i]=f(vx(i),vz(j),T.h[j*VW+i]); } };
  const setK=(f)=>{ for(let j=0;j<TH;j++) for(let i=0;i<TW;i++){ const r=f(cx(i),cz(j),T.k[j*TW+i]); if(r!=null) T.k[j*TW+i]=r; } };
  const bump=(x,z,bx,bz,r,h)=>{const d2=((x-bx)**2+(z-bz)**2)/(r*r); return h*Math.exp(-d2*2.2);};
  if(id!=='blank') setH((x,z)=>(N.fbm(x*0.03,z*0.03)-0.5)*1.6);
  if(id==='grassland'){
    setH((x,z,h)=>h+(N.fbm(x*0.012+7,z*0.012)-0.5)*3);
    setK((x,z)=> N.fbm(x*0.04+30,z*0.04-11)>0.66 && Math.abs(x)<120 ? T_FOREST : null);
    setK((x,z,k)=> Math.abs(z-(Math.sin(x*0.025)*14+10))<1.6 ? T_ROAD : null);
    bld(6, 14+(R()*8|0), 4); bld(-10, 24+(R()*6|0), 4);
  } else if(id==='hills'){
    const hills=[[-80,-30,38,9],[-70,40,30,6],[80,30,36,9],[75,-45,28,6],[0,-60,40,7],[0,60,34,5],[-5,0,22,3]];
    hills.forEach(hh=>{hh[0]+= (R()-.5)*20; hh[1]+=(R()-.5)*20;});
    setH((x,z,h)=>{ let s=h; for(const b of hills) s+=bump(x,z,b[0],b[1],b[2],b[3]); return s; });
    setK((x,z)=> N.fbm(x*0.05+3,z*0.05+9)>0.7 ? T_FOREST : null);
  } else if(id==='forest'){
    setH((x,z,h)=>h+(N.fbm(x*0.015,z*0.015+4)-0.5)*3);
    setK((x,z)=>{ const f=N.fbm(x*0.035+5,z*0.035-5); const clear = Math.abs(z)<12 && Math.abs(x)<130 ? 0.18:0; return f-clear>0.47 ? T_FOREST : null; });
  } else if(id==='river'){
    const rx=z=>Math.sin(z*0.035+1)*10+Math.sin(z*0.011)*6;
    const fords=[-56,-4,48].map(f=>f+(R()-.5)*10);
    setH((x,z,h)=>{ const d=Math.abs(x-rx(z)); const bank=Math.max(0,1-d/14); return h*(1-bank)+ (d<6? -1.7 : -1.7*bank*bank*0.6); });
    setK((x,z)=>{ const d=Math.abs(x-rx(z)); if(d<5){ for(const f of fords) if(Math.abs(z-f)<6) return T_FORD; return T_WATER; } return null; });
    // raise ford beds
    for(let j=0;j<=TH;j++) for(let i=0;i<=TW;i++){ const x=vx(i),z=vz(j); const d=Math.abs(x-rx(z)); if(d<7) for(const f of fords) if(Math.abs(z-f)<7){ T.h[j*VW+i]=Math.max(T.h[j*VW+i],-0.75); } }
    setK((x,z,k)=> k===T_GRASS && N.fbm(x*0.06,z*0.06+50)>0.68 ? T_FOREST : null);
  } else if(id==='pass'){
    const half=x=>15+Math.abs(x)*0.33+ (N.n2(x*0.05,3)-.5)*6;
    setH((x,z,h)=>{ const over=Math.abs(z)-half(x); return over>0 ? h+Math.min(16, 4+over*0.7)+N.fbm(x*0.08,z*0.08)*5 : h+Math.max(0, (over+8))*0.25; });
    setK((x,z)=> Math.abs(z)>half(x) ? T_ROCK : null);
    setK((x,z,k)=> k===T_GRASS && N.fbm(x*0.07+9,z*0.07)>0.72 ? T_FOREST : null);
  } else if(id==='desert'){
    setH((x,z,h)=>{ const r=1-Math.abs(N.fbm(x*0.02+2,z*0.035-3)*2-1); return h+r*r*4.5; });
    setK(()=>T_SAND);
    const rocks=[];
    for(let n=0;n<7;n++) rocks.push([(R()-.5)*260,(R()-.5)*160,4+R()*7]);
    setK((x,z)=>{ for(const r of rocks){ if(Math.hypot(x-r[0],z-r[1])<r[2]) return T_ROCK; } return null; });
    setH((x,z,h)=>{ let s=h; for(const r of rocks){ const d=Math.hypot(x-r[0],z-r[1]); if(d<r[2]+2) s+=Math.max(0,(r[2]+2-d))*1.6; } return s; });
    setK((x,z,k)=> k===T_SAND && N.fbm(x*0.08+20,z*0.08)>0.76 ? T_FOREST : null);
  } else if(id==='fortress'){
    const side=opt.fortSide===0?-1:1; const wx=FORT_X*side;
    setH((x,z,h)=>h*0.6);
    const gates=FORT_GATES;
    setK((x,z)=>{
      if(Math.abs(x-wx)<1.01 && Math.abs(z)<78){ for(const g of gates) if(Math.abs(z-g)<3.2) return T_ROAD; return T_WALL; }
      if(Math.abs(z)>=78 && Math.abs(z)<84 && Math.abs(x-wx)<1.01) return T_WALL;
      return null; });
    setK((x,z,k)=> (Math.abs(z)>84) ? T_ROCK : null);
    setH((x,z,h)=> Math.abs(z)>84 ? h+6+(Math.abs(z)-84)*1.2 : h);
    // towers either side of gates
    for(const g of gates) for(const dz of [-5,5]) for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){ const i=Math.floor((wx*MS+a*TC-X0)/TC), j=Math.floor(((g+dz)*MS+b*TC*0.5-Z0)/TC); if(i>=0&&i<TW&&j>=0&&j<TH) T.k[j*TW+i]=T_WALL; }
    // roads leading to gates, buildings behind
    setK((x,z,k)=>{ if(k!==T_GRASS) return null; for(const g of gates) if(Math.abs(z-g)<1.8 && (x-wx)*side>0 && (x-wx)*side<40) return T_ROAD; return null; });
    for(let n=0;n<10;n++){ const bx=wx+side*(14+R()*30), bz=(R()-.5)*140; bld(bx,bz,4); }
    setK((x,z,k)=> k===T_GRASS && (x*side)<20 && N.fbm(x*0.06,z*0.06+70)>0.7 ? T_FOREST : null);
  }
  // fade heights to 0 at the edges (except water beds)
  for(let j=0;j<=TH;j++) for(let i=0;i<=TW;i++){
    const x=X0+i*TC, z=Z0+j*TC; const e=Math.min(x-X0, X1-x, z-Z0, Z1-z); const m=clamp(e/10,0,1);
    const k=T.h[j*VW+i]; if(k>0 || id!=='river') T.h[j*VW+i]=k*m;
  }
  // rock cells next to edges stay rock; make sure deployment edges are passable in pass map
  T.ver++;
  return T;
}
function placeBuilding(T,x,z,size){
  const i0=Math.floor((x-X0)/TC), j0=Math.floor((z-Z0)/TC);
  if(i0<1||j0<1||i0+size>=TW-1||j0+size>=TH-1) return;
  for(let j=j0;j<j0+size;j++) for(let i=i0;i<i0+size;i++){ const c=j*TW+i; if(T.k[c]!==T_GRASS && T.k[c]!==T_SAND && T.k[c]!==T_ROAD) return; }
  for(let j=j0;j<j0+size;j++) for(let i=i0;i<i0+size;i++){ T.k[j*TW+i]=T_WALL; T.bld[j*TW+i]=255; }
  T.bld[j0*TW+i0]=size;
}

/* ---------- Formations (local slots: x right, z forward) ---------- */
function fmRect(cols,rows,sp,count){
  const out=[]; let left=count;
  for(let r=0;r<rows&&left>0;r++){ const n=Math.min(cols,left), off=(cols-n)*sp/2;
    for(let c=0;c<n;c++) out.push(-(cols-1)*sp/2+off+c*sp, (rows-1)*sp/2-r*sp, 0);
    left-=n; }
  return out;
}
function localToWorld(g,lx,lz){ const ca=Math.cos(g.a), sa=Math.sin(g.a); return [g.cx+sa*lx+ca*lz, g.cz-ca*lx+sa*lz]; }
function worldToLocal(g,wx,wz){ const ca=Math.cos(g.a), sa=Math.sin(g.a), dx=wx-g.cx, dz=wz-g.cz; return [sa*dx-ca*dz, ca*dx+sa*dz]; }

/* ---------- Army generation ---------- */
const STYLES={
  balanced:{name:'Balanced',inf:.55,rng:.25,cav:.12,sie:.04,sup:.04},
  horde:{name:'Infantry horde',inf:.82,rng:.1,cav:.06,sie:.01,sup:.01},
  ranged:{name:'Ranged heavy',inf:.36,rng:.48,cav:.06,sie:.06,sup:.04},
  cavalry:{name:'Cavalry storm',inf:.32,rng:.15,cav:.47,sie:.02,sup:.04},
  siege:{name:'Siege line',inf:.45,rng:.25,cav:.08,sie:.17,sup:.05},
};
function armyCounts(total, pool, style, R){
  const fr=STYLES[style]||STYLES.balanced;
  const by={inf:[],rng:[],cav:[],sie:[],sup:[]};
  pool.forEach(id=>{ const u=UNITS[UID[id]]; if(u) by[u.cls].push(UID[id]); });
  const counts=new Array(NT).fill(0);
  // support first (by ratio)
  if(by.sup.length){
    if(by.sup.includes(UID.cmdr)) counts[UID.cmdr]=Math.max(1,Math.round(total/180));
    if(by.sup.includes(UID.medic)) counts[UID.medic]=Math.round(total/70);
    if(by.sup.includes(UID.eng)) counts[UID.eng]=Math.max(1,Math.round(total/90));
  }
  let used=counts.reduce((a,b)=>a+b,0);
  let sum=0; for(const c of ['inf','rng','cav','sie']) if(by[c].length) sum+=fr[c];
  const rest=Math.max(0,total-used);
  for(const c of ['inf','rng','cav','sie']){
    if(!by[c].length) continue;
    let n=rest*fr[c]/sum;
    if(c==='sie') n=Math.max(1,Math.round(n*0.35)); else n=Math.round(n);
    const ts=by[c], w=ts.map(()=>0.5+R()); const ws=w.reduce((a,b)=>a+b,0);
    ts.forEach((t,k)=>{ counts[t]+=Math.round(n*w[k]/ws); });
  }
  return counts;
}

// Build deploy groups from counts. Team 0 faces +x, team 1 faces -x.
function layoutArmy(team, counts, T, opt={}){
  const dir=team===0?1:-1;
  const front=(team===0?-34:34) - dir*(opt.back||0);
  const groups=[];
  const zoneX=ZONES[team];
  // find widest passable z-run near the front
  const probeX=front-dir*6;
  let bestA=-80,bestB=80, runA=null, bestLen=0;
  for(let z=Z0+4; z<=Z1-4; z+=2){
    const ok=passAtT(T,probeX,z) && passAtT(T,probeX-dir*20,z);
    if(ok){ if(runA===null) runA=z; const len=z-runA; if(len>bestLen){bestLen=len;bestA=runA;bestB=z;} } else runA=null;
  }
  const zc=(bestA+bestB)/2, Wmax=Math.max(20,(bestB-bestA)*0.86);
  const face=team===0?0:Math.PI;
  const mk=(type,cx,cz,slots,order)=>{ groups.push({team,type,order:order||defaultOrder(type),cx,cz,a:face,slots}); };
  // ---- infantry line ----
  const centreRank={heavy:0,shield:1,elite:2,sword:3,bers:4,spear:5};
  const infTypes=UNITS.map((u,i)=>i).filter(i=>UNITS[i].cls==='inf' && counts[i]>0).sort((a,b)=>centreRank[UNITS[a].id]-centreRank[UNITS[b].id]);
  let infWidthNeed=0; infTypes.forEach(t=>infWidthNeed+=counts[t]*UNITS[t].sp*UNITS[t].sp);
  // ranks so the line fits Wmax
  let infRanks=Math.max(3, Math.ceil(infWidthNeed/(Wmax*1.15*1.15)));
  infRanks=Math.min(infRanks,140);
  const blocks=[];
  for(const t of infTypes){
    const sp=UNITS[t].sp; let n=counts[t];
    const ranks=Math.max(2,Math.round(infRanks*1.15/sp));
    let cols=Math.ceil(n/ranks);
    const maxCols=Math.max(6,Math.floor(48/sp));
    while(n>0){ const c=Math.min(cols,maxCols); const take=Math.min(n,c*ranks); blocks.push({t,n:take,cols:Math.ceil(take/ranks),ranks,sp}); n-=take; }
  }
  // arrange blocks: centre outward alternating
  const placed=[]; let left=0,right=0, gap=1.5;
  blocks.forEach((b,k)=>{ const w=b.cols*b.sp; if(k===0){ placed.push({b,z:0}); left=-w/2; right=w/2; } else if(k%2){ placed.push({b,z:right+gap+w/2}); right+=gap+w; } else { placed.push({b,z:left-gap-w/2}); left-=gap+w; } });
  const infHalf=Math.max(right,-left);
  const shiftZ=zc-(left+right)/2;
  let infDepth=0;
  placed.forEach(p=>{ const b=p.b, depth=b.ranks*b.sp; infDepth=Math.max(infDepth,depth);
    mk(b.t, front-dir*depth/2, p.z+shiftZ, fmRect(b.cols,b.ranks,b.sp,b.n)); });
  if(!placed.length) infDepth=0;
  // ---- engineers ahead of the line ----
  if(counts[UID.eng]){ const n=counts[UID.eng], sp=Math.max(2,Math.min(8,(infHalf*2||20)/n)); mk(UID.eng, front+dir*2, zc, fmRect(n,1,sp,n),'hold'); }
  // ---- commanders and medics just behind ----
  let back=front-dir*(infDepth+1.8);
  if(counts[UID.cmdr]){ const n=counts[UID.cmdr]; const sp=Math.max(3,Math.min(14,(infHalf*2||20)/n)); mk(UID.cmdr, back, zc, fmRect(n,1,sp,n)); back-=dir*2.6; }
  if(counts[UID.medic]){ const n=counts[UID.medic]; const cols=Math.min(n,Math.max(4,Math.floor((infHalf*2||20)/2))); const rows=Math.ceil(n/cols); const sp=Math.max(1.6,Math.min(6,(infHalf*2||20)/cols)); mk(UID.medic, back-dir*rows*0.8, zc, fmRect(cols,rows,sp,n)); back-=dir*(rows*1.6+1); }
  // ---- ranged line ----
  const rngTypes=UNITS.map((u,i)=>i).filter(i=>UNITS[i].cls==='rng' && counts[i]>0);
  let rngNeed=0; rngTypes.forEach(t=>rngNeed+=counts[t]*1.21);
  const rngRanks=Math.min(90,Math.max(2,Math.ceil(rngNeed/(Wmax*1.1*1.1))));
  let rb=[]; for(const t of rngTypes){ let n=counts[t]; const sp=UNITS[t].sp; const maxCols=Math.floor(46/sp); let cols=Math.ceil(n/rngRanks); while(n>0){ const c=Math.min(cols,maxCols); const take=Math.min(n,c*rngRanks); rb.push({t,n:take,cols:Math.ceil(take/rngRanks),ranks:rngRanks,sp}); n-=take; } }
  let totalW=rb.reduce((a,b)=>a+b.cols*b.sp+2,0)-2; let zz=zc-totalW/2;
  const rngFront=back-dir*2;
  let rngDepth=0;
  rb.forEach(b=>{ const w=b.cols*b.sp, d=b.ranks*b.sp; rngDepth=Math.max(rngDepth,d); mk(b.t, rngFront-dir*d/2, zz+w/2, fmRect(b.cols,b.ranks,b.sp,b.n)); zz+=w+2; });
  // ---- siege ----
  const sieTypes=UNITS.map((u,i)=>i).filter(i=>UNITS[i].cls==='sie' && counts[i]>0);
  let sieX=rngFront-dir*(rngDepth+4);
  const minX=Math.min(zoneX[0],zoneX[1])+4, maxX=Math.max(zoneX[0],zoneX[1])-4;
  let sn=0; sieTypes.forEach(t=>sn+=counts[t]);
  if(sn){ let ranks=Math.max(1,Math.ceil(sn*4.6/(Wmax))); let sb=[]; for(const t of sieTypes){ let n=counts[t]; while(n>0){ const take=Math.min(n,8*ranks); sb.push({t,n:take,cols:Math.ceil(take/ranks),ranks}); n-=take; } }
    let tw=sb.reduce((a,b)=>a+b.cols*5+3,0)-3; let z2=zc-tw/2;
    sieX=clamp(sieX-dir*ranks*2.5,minX,maxX);
    sb.forEach(b=>{ const w=b.cols*5; mk(b.t, sieX, z2+w/2, fmRect(b.cols,b.ranks,5,b.n)); z2+=w+3; }); }
  // ---- cavalry on the flanks ----
  const cavTypes=UNITS.map((u,i)=>i).filter(i=>UNITS[i].cls==='cav' && counts[i]>0);
  let side=1; let zR=zc+infHalf+6, zL=zc-infHalf-6;
  for(const t of cavTypes){
    const sp=UNITS[t].sp; let total=counts[t];
    const halves=[Math.ceil(total/2), Math.floor(total/2)];
    for(const n of halves){ if(!n) continue;
      const ranks=Math.max(2,Math.min(12,Math.ceil(Math.sqrt(n/2.5))));
      const cols=Math.ceil(n/ranks), w=cols*sp, d=ranks*sp;
      let zcen = side>0 ? zR+w/2 : zL-w/2;
      let cx=front-dir*(d/2+1);
      if(Math.abs(zcen)+w/2>Z1-4 || !passAtT(T,cx,zcen)){ zcen=zc+(side*(infHalf*0.5)); cx=sieX-dir*(d/2+8); cx=clamp(cx,minX,maxX); }
      else { if(side>0) zR+=w+3; else zL-=w+3; }
      mk(t,cx,zcen,fmRect(cols,ranks,sp,n),'flank');
      side=-side; }
  }
  // drop slots on impassable cells or outside the zone

/* ---------- flow fields (Dijkstra toward enemies) ---------- */
const NC=TW*TH;
const FF=[new Float64Array(NC),new Float64Array(NC)], FDX=[new Float32Array(NC),new Float32Array(NC)], FDZ=[new Float32Array(NC),new Float32Array(NC)];
const HN=new Int32Array(NC*8), HK=new Float64Array(NC*8); let HS=0;

const NBX=[1,-1,0,0,1,1,-1,-1], NBZ=[0,0,1,-1,1,-1,1,-1];
function computeFlow(team){

  dist.fill(Infinity); HS=0;
  for(let i=0;i<N;i++){ if(SS[i]===1&&TM[i]===e){ const c=cellIdx(PX[i],PZ[i]); if(dist[c]!==0){ dist[c]=0; hpush(c,0); } } }
  while(HS>0){
    const d=HK[0], c=hpop(); if(d>dist[c]) continue;
    const cx=c%TW, cz=(c/TW)|0;
    for(let n=0;n<8;n++){
      const nx=cx+NBX[n], nz=cz+NBZ[n]; if(nx<0||nx>=TW||nz<0||nz>=TH) continue;
      const nc=nz*TW+nx; const cost=COSTK[K[nc]]; if(cost===Infinity) continue;
      if(n>=4 && (!PASSK[K[cz*TW+nx]] || !PASSK[K[nz*TW+cx]])) continue;

    }

/* ---------- units ---------- */
function initUnit(i,team,type,x,z,a,gi,sx,sz,sa){

}
function makeBattleGroup(dg){

    cnt:dg.slots.length/3,alive:dg.slots.length/3,sx:dg.cx*dg.slots.length/3,sz:dg.cz*dg.slots.length/3,slx:0,slz:0,cx:dg.cx,cz:dg.cz,err:0,fcnt:0,eng:0,ned:1e9,nex:0,nez:0,tg:null,phase:0,side:1,tmr:0,spdNow:0,mdx:Math.cos(dg.a),mdz:Math.sin(dg.a),retreat:false};

// append deploy-format groups to a running (or fresh) battle
function addGroupsToSim(dgs){
  for(const dg of dgs){
    if(N+dg.slots.length/3>=MAXU) compact();
    const gi=G.length, g=makeBattleGroup(dg); G.push(g);
    const ca=Math.cos(dg.a), sa=Math.sin(dg.a);
    for(let k=0;k<dg.slots.length;k+=3){

      const lx=dg.slots[k], lz=dg.slots[k+1];
      initUnit(N, dg.team, dg.type, dg.cx+sa*lx+ca*lz, dg.cz-ca*lx+sa*lz, dg.a+dg.slots[k+2], gi, lx, lz, dg.slots[k+2]);

// commanders and medics marching with the army attach to the nearest fighting regiment and keep their place beside it
function escortHost(g){ let best=null, bd=1e18; for(const h of G){ if(h.team!==g.team||h.cnt<=0) continue; const c=UNITS[h.type].cls; if(c==='sup'||c==='cav'||c==='sie') continue; const d=(h.ax-g.ax)**2+(h.az-g.az)**2; if(d<bd){ bd=d; best=h; } } return best; }

function assignFlankSides(){
  for(let t=0;t<2;t++){ let sx=0,sz=0,n=0; for(const g of G) if(g.team===t&&g.cnt>0){ sx+=g.ax*g.cnt; sz+=g.az*g.cnt; n+=g.cnt; } if(n){B.tcx[t]=sx/n; B.tcz[t]=sz/n;} }

}
function resetBattle(){

  B.start=[0,0]; B.dead=[0,0]; B.esc=[0,0]; B.active=[0,0]; B.fleeing=[0,0]; B.armyLoss=[0,0];
  B.startT=[new Int32Array(NT),new Int32Array(NT)]; B.deadT=[new Int32Array(NT),new Int32Array(NT)]; B.escT=[new Int32Array(NT),new Int32Array(NT)]; B.killsT=[new Int32Array(NT),new Int32Array(NT)]; B.broken=[false,false]; B.lastKill=0; B.phaseT=0; B.noHunt=false;

function setAbilities(team,ab){ B.shieldBlock[team]=ab.shieldwall?.7:.5; B.adjBlock[team]=ab.shieldwall?.45:.3; B.shieldArm[team]=ab.shieldwall?5:3; }

// remove old corpses and escaped units to make room (endless / survival)
function compact(){

/* ---------- combat ---------- */
function damage(t,dmg,src){

  HP[t]-=dmg; FL[t]=1;
  const b=STT[TM[t]][TY[t]];

  if(HP[t]<=0) kill(t,src);
}
function kill(t,src){

  if(src>=0&&src<N){ KL[src]++; B.killsT[TM[src]][TY[src]]++; }
  if(B.onKill) B.onKill(t,src);
  const c=TEAMCOL[tm];
  for(let n=0;n<3;n++) spawnQ(PX[t],PY[t]+0.8,PZ[t],(rnd()-.5)*3,2+rnd()*2.5,(rnd()-.5)*3,1.6,0.16,0,c[0]*.8,c[1]*.8,c[2]*.8,1,5);
  if(rnd()<0.5) dustPuff(PX[t],PY[t],PZ[t],1);
  if(B.rules.morale){
    const x=PX[t], z=PZ[t];
    if(UNITS[ty].id==='cmdr') forEachIn(tm,x,z,15,j=>{ MO[j]-=25; });

  VX[t]=kx*2; VZ[t]=kz*2;
}
function meleeHit(i,t,mult){

/* ---------- groups ---------- */

  const retarget=(tick%10)===1;

  if(retarget){
    for(let t=0;t<2;t++){ let sx=0,sz=0,n=0; for(const g of G) if(g.team===t&&g.alive>0){ sx+=g.cx*g.alive; sz+=g.cz*g.alive; n+=g.alive; } if(n){ B.tcx[t]=sx/n; B.tcz[t]=sz/n; } }

  }

    if(g.cnt>0){ g.cx=g.sx/g.cnt; g.cz=g.sz/g.cnt; }
    if(!g.cnt){ g.spdNow=0; continue; }
    const st=STT[g.team][g.type];
    if(retarget){
      const e=nearestIn(g.team^1,g.cx,g.cz,Math.hypot(X1-X0,Z1-Z0));
      if(e>=0){ g.nex=PX[e]; g.nez=PZ[e]; g.ned=Math.hypot(g.nex-g.cx,g.nez-g.cz); } else g.ned=1e9;
      let best=null, bd=1e18;
      for(const h of G){ if(h.team===g.team||h.alive<=0) continue; let d=(h.cx-g.cx)**2+(h.cz-g.cz)**2; if(st.cls==='cav'){ const hc=UNITS[h.type].cls; if(hc==='rng'||hc==='sie') d*=0.35; } if(d<bd){ bd=d; best=h; } }

    if(stall && (g.order===O_HOLD||g.order===O_FLANK)){ g.order=O_ADV; }
    const err=g.fcnt? g.err/g.fcnt : 0;

}

/* ---------- main tick ---------- */
const SEPX=new Float32Array(MAXU), SEPZ=new Float32Array(MAXU);

function simTick(){
  tick++; simTime+=DT;
  buildGrids();
  if(tick%20===1){ computeFlow(0); computeFlow(1); }
  updateGroups();
  // buffs from shieldbearers and commanders
  if(tick%5===0){
    for(let i=0;i<N;i++){ if(SS[i]!==1) continue; const u=UNITS[TY[i]];
      if(u.shield) forEachIn(TM[i],PX[i],PZ[i],2.3,j=>{ BS[j]=0.3; });
      if(u.aura && (tick%10===0)){ const r=STT[TM[i]][TY[i]].aura; forEachIn(TM[i],PX[i],PZ[i],r,j=>{ BA[j]=0.6; }); }
    }
  }
  B.active[0]=B.active[1]=0; B.fleeing[0]=B.fleeing[1]=0; B.combat[0]=B.combat[1]=0;
  const morale=B.rules.morale;
  const fwd=(tick&1)===0;
  for(let n=0;n<N;n++){
    const i=fwd?n:N-1-n;
    const s=SS[i];
    OX[i]=PX[i]; OZ[i]=PZ[i];
    if(s===0){ if(DE[i]<1) DE[i]=Math.min(1,DE[i]+DT*1.7); continue; }

        const ddx=PX[tgt]-x, ddz=PZ[tgt]-z, d2=ddx*ddx+ddz*ddz;

        else { const reach=st.range+st.r+URAD[TY[tgt]]+0.3; if(d2<=reach*reach) need=false; }

        const dx=wx-x, dz=wz-z, d=Math.sqrt(dx*dx+dz*dz);

        else faceT=g.a+SA[i];
      }
      if(STU[i]>0){ STU[i]-=DT; const f=flowAt(tm,x,z); if(f[0]||f[1]){ const m=Math.max(spd*0.8,Math.hypot(dvx,dvz)); dvx=f[0]*m; dvz=f[1]*m; } }

      if(morale && !st.noFlee){

    if(!passAt(nx,nz)){ if(!(fleeing && (nx<X0+1||nx>X1-1))){ nz=z; VZ[i]*=-0.2; } }

// the whole army routes for good: no rallies, the battle ends once the field clears of fighters
function breakArmy(t){ B.broken[t]=true; for(let i=0;i<N;i++) if(TM[i]===t && SS[i]===1){ SS[i]=2; TG[i]=-1; MO[i]=0; RC[i]=9; } }
function separation(){

    const k0=cStart[c], k1=cStart[c+1]; if(k0===k1) continue;
    const cx=c%CGW, cz=(c/CGW)|0;
    const gz0=cz>0?cz-1:0, gz1=cz<CGH-1?cz+1:cz, gx0=cx>0?cx-1:0, gx1=cx<CGW-1?cx+1:cx;
    for(let ki=k0;ki<k1;ki++){

      const x=SPX[ki], z=SPZ[ki], ri=SRAD[ki], mi=SMAS[ki];
      let fx=0, fz=0;
      for(let gz=gz0;gz<=gz1;gz++){

    const l=Math.hypot(fx,fz); if(l>0.3){ fx*=0.3/l; fz*=0.3/l; }
    const nx=PX[i]+fx, nz=PZ[i]+fz;

}

/* ---------- projectiles ---------- */
const PF=()=>new Float32Array(MAXP);
const PSX=PF(),PSZ=PF(),PRX=PF(),PRY=PF(),PRZ=PF(),POX=PF(),POY=PF(),POZ=PF(),PRVX=PF(),PRVY=PF(),PRVZ=PF(),PRD=PF(),PRA=PF(),PRN=PF();

clearProjectiles();
function spawnProj(k,tm,x,y,z,vx,vy,vz,dmg,own,aoe,pen,pierce){

}
function freeProj(p){ PRL[p]=0; pFree[pTop++]=p; }
function fire(i,t,d){

  tx+=gauss()*sig; tz+=gauss()*sig;
  const x0=PX[i], z0=PZ[i], y0=PY[i]+(st.isSiege?1.6:1.4);
  let ty=heightAt(tx,tz)+((k===2||k===4)?0.9:0);
  if(k===5){ tx=x0+(tx-x0)*0.72; tz=z0+(tz-z0)*0.72; ty=heightAt(tx,tz); }

  else if(k===5){ spawnQ(x0+fx*1.6,y0,z0+fz*1.6,0,0,0,0.12,1.1,8,1,0.75,0.35,0.95,0); smokePuff(x0+fx*1.8,y0,z0+fz*1.8,4,0.9); }

function midHit(p){
  const x=PRX[p], z=PRZ[p], y=PRY[p], tm=PRT[p];
  let cx=((x-X0)/CCS)|0, cz=((z-Z0)/CCS)|0; if(cx<1||cz<1||cx>=CGW-1||cz>=CGH-1) return false;
  for(let gz=cz-1;gz<=cz+1;gz++) for(let gx=cx-1;gx<=cx+1;gx++){ const c=gz*CGW+gx;
    for(let k=cStart[c],e=cStart[c+1];k<e;k++){ const j=cIdx[k]; if(TM[j]===tm||j===PRH[p]) continue; const s=SS[j]; if(s!==1&&s!==2) continue;
      const dx=PX[j]-x, dz=PZ[j]-z, rr=URAD[TY[j]]+0.3; if(dx*dx+dz*dz>rr*rr) continue; if(y<PY[j]-0.3||y>PY[j]+2.5) continue;

      const kind=PRK[p];
      if(kind===2){ freeProj(p); return true; }
      if(kind===5){ const vl=Math.hypot(PRVX[p],PRVZ[p])||1; knock(j,PRVX[p]/vl*1.2/Math.sqrt(UMASS[TY[j]]),PRVZ[p]/vl*1.2/Math.sqrt(UMASS[TY[j]])); }
      PRD[p]*= kind===5?0.85:0.8; if(PRP[p]>0) PRP[p]--; if(PRP[p]===0){ freeProj(p); return true; }

}
function coverAt(x,z,dx,dz){ for(let s=1.2;s<=3.7;s+=1.25){ if(kindAt(x+dx*s,z+dz*s)===T_WALL) return true; } return false; }
function projHit(p,j){
  const b=STT[TM[j]][TY[j]], k=PRK[p];
  const vx=PRVX[p], vz=PRVZ[p], vl=Math.hypot(vx,vz)||1;
  const front=(Math.cos(FA[j])*(-vx)+Math.sin(FA[j])*(-vz))/vl;
  if(k<=2||k===4){
    if(b.shield && front>0.2 && rnd()<B.shieldBlock[TM[j]]){ spark(PX[j],PY[j]+1,PZ[j]); sfx(EV_BLOCK,PX[j],PY[j],PZ[j]); return; }
    if(BS[j]>0 && front>0.2 && rnd()<B.adjBlock[TM[j]]){ spark(PX[j],PY[j]+1,PZ[j]); sfx(EV_BLOCK,PX[j],PY[j],PZ[j]); return; }
    if(k<=1 && TER.k[cellIdx(PX[j],PZ[j])]===T_FOREST && rnd()<0.35) return;
    if(coverAt(PX[j],PZ[j],-vx/vl,-vz/vl) && rnd()<0.75){ spark(PX[j]-vx/vl*1.2,PY[j]+1.5,PZ[j]-vz/vl*1.2); sfx(EV_BLOCK,PX[j],PY[j],PZ[j]); return; }
  }

  let arm=b.armor+(BS[j]>0?B.shieldArm[TM[j]]:0); arm*=1-PRN[p];

}
function arrowLand(p){
  const x=PRX[p], z=PRZ[p], tm=PRT[p];
  let cx=((x-X0)/CCS)|0, cz=((z-Z0)/CCS)|0; if(cx<1||cz<1||cx>=CGW-1||cz>=CGH-1) return;
  let best=-1, bd=Infinity;
  for(let gz=cz-1;gz<=cz+1;gz++) for(let gx=cx-1;gx<=cx+1;gx++){ const c=gz*CGW+gx;
    for(let k=cStart[c],e=cStart[c+1];k<e;k++){ const j=cIdx[k]; if(TM[j]===tm) continue; const s=SS[j]; if(s!==1&&s!==2) continue;
      const dx=PX[j]-x, dz=PZ[j]-z, rr=URAD[TY[j]]+0.35, d2=dx*dx+dz*dz; if(d2<rr*rr && d2<bd){ bd=d2; best=j; } } }
  if(best>=0) projHit(p,best); else if(rnd()<0.25) spawnQ(x,heightAt(x,z)+0.05,z,0,0.3,0,0.7,0.25,0.6,0.6,0.55,0.45,0.3,2);
}
function explode(p){
  const x=PRX[p], z=PRZ[p], r=PRA[p], tm=PRT[p], dmg=PRD[p], y=heightAt(x,z);
  const x0=Math.max(0,((x-r-X0)/CCS)|0), x1=Math.min(CGW-1,((x+r-X0)/CCS)|0), z0=Math.max(0,((z-r-Z0)/CCS)|0), z1=Math.min(CGH-1,((z+r-Z0)/CCS)|0);
  for(let gz=z0;gz<=z1;gz++) for(let gx=x0;gx<=x1;gx++){ const c=gz*CGW+gx;
    for(let k=cStart[c],e=cStart[c+1];k<e;k++){ const j=cIdx[k]; if(TM[j]===tm) continue; const s=SS[j]; if(s!==1&&s!==2) continue;
      const dx=PX[j]-x, dz=PZ[j]-z, d=Math.sqrt(dx*dx+dz*dz); if(d>r) continue;
      const f=1-d/r*0.6, b=STT[TM[j]][TY[j]];

  const col=TER.theme==='desert'?[0.72,0.62,0.42]:[0.38,0.32,0.22];
  for(let n=0;n<7;n++) spawnQ(x,y+0.3,z,(rnd()-.5)*8,4+rnd()*5,(rnd()-.5)*8,1.4,0.18,0,col[0],col[1],col[2],1,5);

function updateProjectiles(){
  for(let p=0;p<pHigh;p++){

    const k=PRK[p];

    const flat=(k===2||k===4||k===5);
    const steps=flat?Math.max(1,Math.ceil(Math.hypot(PRVX[p],PRVZ[p])*DT/0.8)):1, sdt=DT/steps;
    for(let s=0;s<steps;s++){
      PRX[p]+=PRVX[p]*sdt; PRY[p]+=PRVY[p]*sdt; PRZ[p]+=PRVZ[p]*sdt;
      const x=PRX[p], z=PRZ[p];
      if(x<X0||x>X1||z<Z0||z>Z1||PRY[p]<-20){ freeProj(p); break; }
      const gh=heightAt(x,z);
      if(flat && PRY[p]-gh<2.6){ if(midHit(p)) break; if(!PRL[p]) break; }
      // walls stop low missiles, except within a few metres of the shooter (firing over the parapet)
      if(k<=2 && kindAt(x,z)===T_WALL && PRY[p]-gh<2.8 && (x-PSX[p])*(x-PSX[p])+(z-PSZ[p])*(z-PSZ[p])>25){ spark(x,PRY[p],z); sfx(EV_BLOCK,x,PRY[p],z); freeProj(p); break; }
      if(PRY[p]<=gh){

        else if(k===3||k===6){ explode(p); freeProj(p); break; }
        else if(k<=1){ arrowLand(p); freeProj(p); break; }
        else { if(rnd()<0.5) dustPuff(x,gh,z,0); freeProj(p); break; }
      }
    }
  }
}

/* ---------- particles (visual only) ---------- */
const QF=()=>new Float32Array(MAXQ);
const QX=QF(),QY=QF(),QZ=QF(),QVX=QF(),QVY=QF(),QVZ=QF(),QL=QF(),QM=QF(),QS=QF(),QG=QF(),QR=QF(),QGc=QF(),QB=QF(),QA=QF();

// flags: 1 gravity, 2 drag, 4 stop on ground
function spawnQ(x,y,z,vx,vy,vz,life,size,grow,r,g,b,a,flags){
  const q=qHead; qHead=(qHead+1)%MAXQ;
  QX[q]=x;QY[q]=y;QZ[q]=z;QVX[q]=vx;QVY[q]=vy;QVZ[q]=vz;QL[q]=life;QM[q]=life;QS[q]=size;QG[q]=grow;QR[q]=r;QGc[q]=g;QB[q]=b;QA[q]=a;QK[q]=flags;
}
function spark(x,y,z){ for(let n=0;n<2;n++) spawnQ(x,y,z,(rnd()-.5)*4,1+rnd()*3,(rnd()-.5)*4,0.28,0.11,0,1,0.86,0.5,1,1); }
function dustPuff(x,y,z,big){

  for(let k=0;k<n;k++) spawnQ(x+(rnd()-.5)*big,y+0.2,z+(rnd()-.5)*big,(rnd()-.5)*0.8,0.4+rnd()*0.5,(rnd()-.5)*0.8,1.4+rnd()*0.8,0.5+big*0.3,0.9+big*0.4,d?0.82:0.6,d?0.72:0.54,d?0.52:0.42,d?0.4:0.32,2);
}
function smokePuff(x,y,z,n,s){ for(let k=0;k<n;k++) spawnQ(x+(rnd()-.5)*s,y+(rnd())*s*0.5,z+(rnd()-.5)*s,(rnd()-.5)*0.6,0.5+rnd()*0.5,(rnd()-.5)*0.6,2.5+rnd()*1.5,0.5*s+0.3,1.1*s,0.86,0.86,0.83,0.55,2); }
function updateParticles(dt){
  if(dt<=0) return;
  const drag=Math.max(0,1-1.6*dt);
  for(let q=0;q<MAXQ;q++){
    if(QL[q]<=0) continue;
    QL[q]-=dt; const f=QK[q];
    if(f&1) QVY[q]-=9.8*0.7*dt;
    if(f&2){ QVX[q]*=drag; QVY[q]*=drag; QVZ[q]*=drag; }
    QX[q]+=QVX[q]*dt; QY[q]+=QVY[q]*dt; QZ[q]+=QVZ[q]*dt; QS[q]+=QG[q]*dt;
    if(f&4){ const h=heightAt(QX[q],QZ[q])+0.05; if(QY[q]<h){ QY[q]=h; QVX[q]=QVY[q]=QVZ[q]=0; } }
  }
}

/* ---------- math ---------- */
function mat4mul(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }

function lookAt(e,t,u){

  return {m:new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1]), right:[xx,xy,xz], up:[yx,yy,yz], back:[zx,zy,zz]};
}

/* ---------- camera ---------- */
const CAM={tx:0,tz:0,yaw:Math.PI/2,pitch:0.6,dist:150, g:{tx:0,tz:0,yaw:Math.PI/2,pitch:0.6,dist:150}, fov:48*Math.PI/180,
  follow:-1, followT:0, mode:'iso', eye:[0,100,100], right:[1,0,0], up:[0,1,0], fwd:[0,0,-1], vp:new Float32Array(16), aspect:1, W:1, H:1, ty:0};
function camSnap(){ Object.assign(CAM,{tx:CAM.g.tx,tz:CAM.g.tz,yaw:CAM.g.yaw,pitch:CAM.g.pitch,dist:CAM.g.dist}); }
const CAM_MAX=460*MS;
function camClamp(o){ o.tx=clamp(o.tx,X0-20,X1+20); o.tz=clamp(o.tz,Z0-20,Z1+20); o.pitch=clamp(o.pitch,0.12,1.47); o.dist=clamp(o.dist,6,CAM_MAX); }
function camPreset(mode,snap){
  CAM.mode=mode; CAM.follow=-1;
  const portrait=CAM.aspect<0.9;
  const fit=portrait? 1/Math.max(0.45,CAM.aspect*1.25) : 1;
  if(mode==='top') Object.assign(CAM.g,{tx:0,tz:0,yaw:portrait?Math.PI:Math.PI/2,pitch:1.45,dist:portrait?250*MS:205*MS});
  else if(mode==='iso') Object.assign(CAM.g,{tx:portrait?-20:0,tz:0,yaw:portrait?Math.PI-0.42:Math.PI/2+0.42,pitch:0.62,dist:190*Math.min(1.5,fit)});
  else if(mode==='close'){ CAM.follow=-2; CAM.followT=0; Object.assign(CAM.g,{pitch:0.32,dist:22}); }
  camClamp(CAM.g); if(snap) camSnap();
}
function camUpdate(dt){
  if(CAM.follow!==-1){

    if(f<0 || f>=N || SS[f]!==1 || CAM.followT<=0){ f=pickFollowUnit(); CAM.follow=f; CAM.followT=7; }
    if(f>=0){ CAM.g.tx=PX[f]; CAM.g.tz=PZ[f]; }
    CAM.g.yaw+=dt*0.07;
  }
  const k=1-Math.exp(-dt*7);

}
function pickFollowUnit(){
  if(!N) return -2;
  let best=-2, bs=-1;
  for(let n=0;n<40;n++){ const i=(Math.random()*N)|0; if(SS[i]!==1) continue; const s=(TG[i]>=0?2:0)+AT[i]+(UNITS[TY[i]].cls==='cav'?0.5:0)+Math.random(); if(s>bs){ bs=s; best=i; } }

}
function computeView(){
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);

  const t=[CAM.tx,CAM.ty,CAM.tz], e=[CAM.tx+CAM.dist*cp*Math.cos(CAM.yaw), CAM.ty+CAM.dist*sp, CAM.tz+CAM.dist*cp*Math.sin(CAM.yaw)];

function screenRay(sx,sy){
  const nx=(sx/CAM.W)*2-1, ny=1-(sy/CAM.H)*2, th=Math.tan(CAM.fov/2);

    case T_FOREST: c=des?[0.46,0.5,0.28]:[0.26,0.4,0.21]; break;
    case T_WATER: c=[0.2,0.3,0.3]; break;
    case T_FORD: c=[0.4,0.44,0.36]; break;
    case T_ROCK: c=[0.5,0.48,0.46]; break;
    case T_SAND: c=[0.83,0.71,0.48]; break;
    case T_WALL: c=[0.46,0.44,0.41]; break;
    case T_STAKES: c=des?[0.6,0.5,0.34]:[0.43,0.37,0.25]; break;

/* ================= SOUND ================= */
// Every sound is synthesised into an AudioBuffer when audio first unlocks (no files to load).
// One-shots are placed by distance and screen side relative to the camera and rate-limited per kind,
// so the loudest nearby events play first; continuous loops (melee din, hooves, marching, wind) follow
// how much is happening near the camera.
const AUD={ctx:null,on:true,vol:0.8,amb:0.7,ready:false,building:false,voices:0,MAXV:32,
  B:{}, bus:{}, beds:{}, tok:new Float32Array(EV_N), cand:[], din:0, hoof:0, march:0, sampleT:0,
  volley:0, volleyPan:0, volleyW:0, volleyT:0, lastPlace:0, L:[0,0,0]};
const AUD_KEY='massive-armies-audio';
function audLoadPrefs(){ try{ const p=JSON.parse(localStorage.getItem(AUD_KEY)||'null'); if(p){ AUD.on=p.on!==false; if(p.vol>=0&&p.vol<=1) AUD.vol=+p.vol; if(p.amb>=0&&p.amb<=1) AUD.amb=+p.amb; } }catch(e){} }
function audSavePrefs(){ try{ localStorage.setItem(AUD_KEY,JSON.stringify({on:AUD.on,vol:AUD.vol,amb:AUD.amb})); }catch(e){} }
const AR=Math.random;

/* ---------- synthesis helpers (plain arrays) ---------- */
function noiseArr(n){ const d=new Float32Array(n); for(let i=0;i<n;i++) d[i]=AR()*2-1; return d; }
function lp1(d,fc,SR){ const a=1-Math.exp(-2*Math.PI*fc/SR); let y=0; for(let i=0;i<d.length;i++){ y+=a*(d[i]-y); d[i]=y; } return d; }
function hp1(d,fc,SR){ const a=1-Math.exp(-2*Math.PI*fc/SR); let y=0; for(let i=0;i<d.length;i++){ y+=a*(d[i]-y); d[i]-=y; } return d; }
// RBJ band-pass with a centre frequency that may move over time
function bp(d,SR,fcAt,Q){ let x1=0,x2=0,y1=0,y2=0,b0=0,b2=0,a1=0,a2=0;
  for(let i=0;i<d.length;i++){
    if((i&31)===0){ const w=2*Math.PI*Math.min(fcAt(i/SR),SR*0.45)/SR, al=Math.sin(w)/(2*Q), a0=1+al; b0=al/a0; b2=-al/a0; a1=-2*Math.cos(w)/a0; a2=(1-al)/a0; }
    const x=d[i], y=b0*x+b2*x2-a1*y1-a2*y2; x2=x1; x1=x; y2=y1; y1=y; d[i]=y; }
  return d; }
function decay(n,SR,tau){ const e=new Float32Array(n), k=Math.exp(-1/(tau*SR)); let v=1; for(let i=0;i<n;i++){ e[i]=v; v*=k; } return e; }
// add `src` into `dst` at sample `at`, optionally wrapping (for seamless loops)
function mixIn(dst,src,at,g,wrap){ const n=dst.length; for(let i=0;i<src.length;i++){ let j=at+i; if(j>=n){ if(!wrap) break; j%=n; } dst[j]+=src[i]*g; } }
// crossfade the tail beyond n back onto the head so the loop has no seam
function loopify(d,n,X){ const o=d.slice(0,n); for(let i=0;i<X;i++){ const t=i/X; o[i]=d[i]*t+d[n+i]*(1-t); } return o; }
function toBuf(chs,peak){ const c=AUD.ctx; let m=0; for(const d of chs) for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>m) m=a; }
  const s=m>0?(peak||0.9)/m:1, b=c.createBuffer(chs.length,chs[0].length,c.sampleRate);
  chs.forEach((d,k)=>{ for(let i=0;i<d.length;i++) d[i]*=s; b.copyToChannel(d,k); }); return b; }

/* ---------- individual sounds ---------- */
// weapon clash: a bright, short burst of filtered noise with only a brief, slightly wavering ring under it,
// so it reads as a hit rather than a bell. Wood (shields) is a hollow knock with no ring at all.
function sClang(SR,metal){
  const n=((metal?0.2:0.13)*SR)|0, d=new Float32Array(n);
  if(metal){
    const sh=noiseArr(n), fc=2400+AR()*2000; bp(sh,SR,t=>fc*(1-0.25*t/0.2),1.4); const e=decay(n,SR,0.018+AR()*0.012);
    for(let i=0;i<n;i++) d[i]=sh[i]*e[i]*3;
    const f0=900+AR()*800;
    for(const [r,a,tau] of [[1,0.28,0.035],[1.41+AR()*0.12,0.2,0.025],[2.13+AR()*0.15,0.12,0.015]]){
      const w=2*Math.PI*f0*r/SR, k=Math.exp(-1/(tau*SR)), wob=2*Math.PI*(17+AR()*14)/SR; let ph=AR()*6.28, g=a;
      for(let i=0;i<n;i++){ ph+=w*(1+0.012*Math.sin(wob*i)); d[i]+=Math.sin(ph)*g; g*=k; } }
  } else {
    const kn=noiseArr(n), fc=480+AR()*360; bp(kn,SR,()=>fc,2.2); const e=decay(n,SR,0.028);
    for(let i=0;i<n;i++) d[i]=kn[i]*e[i]*3.2;
  }
  const tr=hp1(noiseArr(n),2200,SR), te=decay(n,SR,0.0022); for(let i=0;i<n;i++) d[i]+=tr[i]*te[i]*0.9;
  const w2=2*Math.PI*(metal?190+AR()*50:130+AR()*40)/SR, be=decay(n,SR,0.028); for(let i=0;i<n;i++) d[i]+=0.6*Math.sin(w2*i)*be[i];
  return d; }
function sThud(SR,f,len,noiseAmt){
  const n=(len*SR)|0, d=new Float32Array(n); let ph=0;
  for(let i=0;i<n;i++){ const t=i/SR; ph+=2*Math.PI*f*(1+1.6*Math.exp(-t/0.012))/SR; d[i]=Math.sin(ph)*Math.exp(-t/(len*0.35)); }
  const nz=lp1(noiseArr(n),900,SR), e=decay(n,SR,0.025); for(let i=0;i<n;i++) d[i]+=nz[i]*e[i]*(noiseAmt||0.8);
  return d; }
function sWhoosh(SR){
  const len=0.95, n=(len*SR)|0, d=noiseArr(n), f0=3200+AR()*900, f1=800+AR()*300;
  bp(d,SR,t=>f1+(f0-f1)*Math.exp(-t/0.35),1.1);
  const fl=20+AR()*25; for(let i=0;i<n;i++){ const t=i/SR, env=Math.min(1,t/0.1)*Math.exp(-Math.max(0,t-0.1)/0.28); d[i]*=env*(0.75+0.25*Math.sin(2*Math.PI*fl*t)); }
  return d; }
function sStruck(SR){
  const n=(0.09*SR)|0, d=new Float32Array(n), cl=hp1(noiseArr(n),3000,SR), e1=decay(n,SR,0.0025);
  for(let i=0;i<n;i++) d[i]=cl[i]*e1[i]*1.2;
  mixIn(d,sThud(SR,150+AR()*60,0.08,0.6),0,0.7);
  const w=2*Math.PI*(800+AR()*300)/SR, e2=decay(n,SR,0.012); for(let i=0;i<n;i++) d[i]+=0.35*Math.sin(w*i)*e2[i];
  return d; }
function sMusket(SR){
  const n=(0.8*SR)|0, d=new Float32Array(n), a=noiseArr(n), b=lp1(noiseArr(n),1300,SR), c=lp1(noiseArr(n),260,SR);
  const e1=decay(n,SR,0.0028), e2=decay(n,SR,0.11), e3=decay(n,SR,0.32), e4=decay(n,SR,0.05);
  for(let i=0;i<n;i++) d[i]=a[i]*e1[i]*1.4+b[i]*e2[i]*0.9+c[i]*e3[i]*0.7+Math.sin(2*Math.PI*68*i/SR)*e4[i]*0.6;
  return d; }
function sCannon(SR){
  const n=(2.3*SR)|0, d=new Float32Array(n), a=hp1(noiseArr(n),1500,SR), b=lp1(noiseArr(n),480,SR), c=lp1(lp1(noiseArr(n),140,SR),140,SR);
  let ph=0; const ea=decay(n,SR,0.006), eb=decay(n,SR,0.38), ec=decay(n,SR,1.0);
  for(let i=0;i<n;i++){ const t=i/SR; ph+=2*Math.PI*(38+70*Math.exp(-t/0.07))/SR; d[i]=Math.sin(ph)*Math.exp(-t/0.55)*1.3+a[i]*ea[i]*0.7+b[i]*eb[i]*1.1+c[i]*ec[i]*1.4; }
  return d; }
function sDebris(SR,n,from,to,count,amp){ const d=new Float32Array(n);
  for(let k=0;k<count;k++){ const t=from+AR()*(to-from), at=(t*SR)|0, m=(0.004*SR)|0, cl=hp1(noiseArr(m),1800,SR), e=decay(m,SR,0.0012); for(let i=0;i<m;i++) cl[i]*=e[i]; mixIn(d,cl,at,amp*Math.exp(-t/0.4)*(0.3+AR()*0.7)); }
  return d; }
function sImpact(SR){ // boulder landing
  const n=(1.3*SR)|0, d=sThud(SR,48,1.3,0.2), nz=lp1(noiseArr(n),650,SR), e=decay(n,SR,0.28);
  for(let i=0;i<n;i++) d[i]=d[i]*1.2+nz[i]*e[i]*1.3;
  mixIn(d,sDebris(SR,n,0.04,0.8,40,0.6),0,1); return d; }
function sBlast(SR){ // explosive shell
  const d=sCannon(SR); mixIn(d,sDebris(SR,d.length,0.05,0.9,55,0.8),0,1); return d; }
function sLaunch(SR){ // catapult creak and arm slam
  const n=(0.85*SR)|0, d=new Float32Array(n); let next=0;
  for(let i=0;i<0.2*SR;i++){ if(i>=next){ const t=i/SR, rate=30+300*t; next=i+SR/rate; const m=(0.006*SR)|0, s=noiseArr(m); bp(s,SR,()=>620,6); mixIn(d,s,i,0.4); } }

/* ---------- seamless ambience loops (stereo) ---------- */
function loopDin(SR){ const sec=4, n=sec*SR, X=(0.4*SR)|0, out=[];

    let a=noiseArr(n+X), b=a.slice(), c=a.slice(); bp(a,SR,()=>560,2.2); bp(b,SR,()=>1250,3); lp1(c,320,SR);
    const r=new Float32Array(n+X); const P=[[1,AR()*6],[3,AR()*6],[7,AR()*6]];
    for(let i=0;i<n+X;i++){ const t=i/SR; let m=0.7; for(const [k,ph] of P) m+=0.1*Math.sin(2*Math.PI*k*t/sec+ph); r[i]=(a[i]*1.0+b[i]*0.6+c[i]*0.5)*m; }

/* ---------- engine ---------- */
function audBuild(){
  const c=AUD.ctx, SR=c.sampleRate, B=AUD.B;
  const master=c.createGain(); master.gain.value=AUD.on?AUD.vol:0;
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.25;
  master.connect(comp); comp.connect(c.destination);
  const mk=(g,to)=>{ const n=c.createGain(); n.gain.value=g; n.connect(to||master); return n; };
  AUD.bus={master, sfx:mk(0.9), amb:mk(AUD.amb), ui:mk(0.45), mus:mk(0.75)};
  const tasks=[
    ()=>{ const rv=c.createConvolver(); rv.buffer=impulseResponse(SR); const g=mk(0.42); rv.connect(g); AUD.bus.wet=rv; },
    ...sfxTasks(),
    audLoadSamples,
    ()=>{ B.loopDin=loopDin(SR); },
    ()=>{ B.loopHoof=loopHooves(SR); B.loopMarch=loopMarch(SR); },
    ()=>{ B.loopWind=loopWind(SR);
      for(const [k,buf] of [['din',B.loopDin],['hoof',B.loopHoof],['march',B.loopMarch],['wind',B.loopWind]]){
        const s=c.createBufferSource(); s.buffer=buf; s.loop=true; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=4000; const g=c.createGain(); g.gain.value=0;
        s.connect(f); f.connect(g); g.connect(AUD.bus.amb); s.start(c.currentTime+AR()*0.1); AUD.beds[k]={s,f,g}; }
      AUD.ready=true; },
  ];
  runTasks(tasks);
}
// spread synthesis over several tasks so the page never stalls for long
function runTasks(tasks,done){ const run=()=>{ const t=tasks.shift(); if(!t){ if(done) done(); return; } try{ t(); }catch(e){ console.warn('audio build failed',e); AUD.building=false; return; } setTimeout(run,0); }; run(); }
// the one-shot effects, from ZzFX recipes or the original hand-built synthesis
// the hand-built effects; recorded samples replace most of them once decoded

    ()=>{ B.clang=[0,1,2,3,4,5].map(()=>toBuf([sClang(SR,true)])); B.wood=[0,1,2].map(()=>toBuf([sClang(SR,false)])); },
    ()=>{ B.thud=[0,1,2,3].map(()=>toBuf([sThud(SR,95+AR()*70,0.22)])); B.struck=[0,1,2,3].map(()=>toBuf([sStruck(SR)])); },
    ()=>{ B.whoosh=[0,1,2].map(()=>toBuf([sWhoosh(SR)])); B.musket=[0,1,2,3].map(()=>toBuf([sMusket(SR)])); },
    ()=>{ B.cannon=[0,1].map(()=>toBuf([sCannon(SR)])); },
    ()=>{ B.impact=[0,1].map(()=>toBuf([sImpact(SR)])); B.blast=[toBuf([sBlast(SR)])]; },
    ()=>{ B.launch=[0,1].map(()=>toBuf([sLaunch(SR)])); B.xbow=[0,1].map(()=>toBuf([sTwang(SR,170+AR()*40,0.35)])); B.ballista=[toBuf([sTwang(SR,72,0.8)])]; },
    ()=>{ B.drum=[toBuf([sDrum(SR)])]; B.coin=[toBuf([sBell(SR,[[1568,0],[2093,0.07]])])]; B.tick=[toBuf([sTock(SR)],0.5)]; B.place=[0,1,2].map(()=>toBuf([sTick(SR,320+AR()*160,0.04)],0.5)); },

    ()=>{ B.hornDefeat=[toBuf([sHorn(SR,[[110,0,0.8],[82.4,0.85,1.9]])])]; B.fanfare=[toBuf([sFanfare(SR)])]; },

// a short run of effects to hear the current set
function audPreview(){ if(!audLive()) return; const B=AUD.B, seq=[['clang',.5,0],['clang',.45,.35],['wood',.55,.7],['punch',.55,1.05],['struck',.4,1.4],['xbow',.45,1.75],['musket',.55,2.1],['woodH',.6,2.5],['thud',.7,2.9],['cannon',.75,3.4],['coin',.4,4.4]];

function audUnlock(){

['pointerdown','keydown','touchend'].forEach(t=>window.addEventListener(t,audUnlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!AUD.ctx) return; if(document.hidden) AUD.ctx.suspend().catch(()=>{}); else if(AUD.on) AUD.ctx.resume().catch(()=>{}); });
function audSetOn(on){ AUD.on=on; audSavePrefs(); if(on) audUnlock(); if(AUD.ctx&&AUD.bus.master){ const g=AUD.bus.master.gain, t=AUD.ctx.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(on?AUD.vol:0,t,0.05); if(!on) setTimeout(()=>{ if(!AUD.on&&AUD.ctx) AUD.ctx.suspend().catch(()=>{}); },400); } }

function audSetAmb(v){ AUD.amb=v; audSavePrefs(); if(AUD.ctx&&AUD.bus.amb) AUD.bus.amb.gain.setTargetAtTime(v,AUD.ctx.currentTime,0.05); }
const audLive=()=>AUD.ready&&AUD.on&&AUD.ctx.state==='running';

// play one buffer: gain, stereo pan, playback rate, low-pass cutoff (distance muffling), reverb send, delay, bus
function audPlay(list,g,pan,rate,lp,wet,delay,bus){
  if(!audLive()||!list||AUD.voices>=AUD.MAXV||g<0.004) return;
  const c=AUD.ctx, s=c.createBufferSource(); s.buffer=list[(AR()*list.length)|0]; s.playbackRate.value=rate||1;
  let node=s; const nodes=[s];
  if(lp && lp<15000){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; node.connect(f); node=f; nodes.push(f); }
  const gn=c.createGain(); gn.gain.value=g; node.connect(gn); nodes.push(gn);
  let out=gn; if(pan){ const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1); gn.connect(p); out=p; nodes.push(p); }
  out.connect(bus||AUD.bus.sfx);
  if(wet>0&&AUD.bus.wet){ const w=c.createGain(); w.gain.value=wet; gn.connect(w); w.connect(AUD.bus.wet); nodes.push(w); }
  AUD.voices++; s.onended=()=>{ AUD.voices--; for(const n of nodes) n.disconnect(); };

const audUi=(name,g,rate)=>audPlay(AUD.B[name],g,0,rate||1,0,0,0,AUD.bus.ui);
const audMusic=(name,g,delay)=>audPlay(AUD.B[name],g,0,1,0,0.25,delay||0,AUD.bus.mus);

/* ---------- per-kind tuning: [rate/s, burst, base gain, buffer, pitch spread] ---------- */
const EVK=[];
EVK[EV_HIT]=[7,2,0.42]; EVK[EV_KILL]=[3,1,0.5]; EVK[EV_BLOCK]=[3,1,0.32]; EVK[EV_CHARGE]=[3,2,0.85]; EVK[EV_BRACE]=[2,1,0.8];
EVK[EV_FIRE+0]=[0,0,0]; EVK[EV_FIRE+1]=[3,2,0.38,'xbow']; EVK[EV_FIRE+2]=[8,3,0.62,'musket']; EVK[EV_FIRE+3]=[2,1,0.7,'launch'];
EVK[EV_FIRE+4]=[2,1,0.6,'ballista']; EVK[EV_FIRE+5]=[3,2,1.0,'cannon']; EVK[EV_FIRE+6]=[3,2,0.55,'cannon'];
EVK[EV_IMPACT]=[3,1,0.8,'impact']; EVK[EV_BOOM]=[3,1,0.95,'blast']; EVK[EV_BOUNCE]=[2,1,0.5,'thud']; EVK[EV_STRUCK]=[4,2,0.34,'struck'];
const AUD_R=30;
function audW(x,y,z){ const L=AUD.L, dx=x-L[0], dy=y-L[1], dz=z-L[2], d2=dx*dx+dy*dy+dz*dz; return 1/(1+d2/(AUD_R*AUD_R)); }
function audPan(x,z){ const L=AUD.L, dx=x-L[0], dz=z-L[2], d=Math.sqrt(dx*dx+dz*dz)+6; return clamp((dx*CAM.right[0]+dz*CAM.right[2])/d,-1,1)*0.85; }
// one sound per event, at its natural pitch
function audVoice(t,w,pan,delay){
  const k=EVK[t], g=k[2]*Math.pow(w,0.8), lp=1100+15000*Math.pow(w,1.4), wet=0.08+0.45*(1-w), B=AUD.B;
  const buf= t===EV_HIT||t===EV_BRACE ? B.clang : t===EV_BLOCK ? B.wood : t===EV_KILL ? (B.punch||B.thud) : t===EV_CHARGE||t===EV_IMPACT ? B.thud :
    t===EV_FIRE+3 ? (B.woodH||B.launch) : B[k[3]];
  audPlay(buf,g,pan,1,lp,wet,delay);
}
function audioFrame(dt,phase,speed){
  const n=evN; evN=0; evSeen=0;
  if(!audLive()) return;
  const c=AUD.ctx, now=c.currentTime;
  // listener sits between the camera and the point it looks at, so zooming in brings the fight closer
  const L=AUD.L, e=CAM.eye; L[0]=CAM.tx+(e[0]-CAM.tx)*0.25; L[1]=CAM.ty+(e[1]-CAM.ty)*0.25; L[2]=CAM.tz+(e[2]-CAM.tz)*0.25;
  for(let t=0;t<EV_N;t++){ const k=EVK[t]; if(k) AUD.tok[t]=Math.min(k[1],AUD.tok[t]+k[0]*dt); }
  // keep the three most audible events of each kind this frame
  const cand=AUD.cand; for(let t=0;t<EV_N;t++){ if(!cand[t]) cand[t]=[]; cand[t].length=0; }
  let melee=0, meleeW2=0;
  for(let i=0;i<n;i++){
    const t=EVT[i], w=audW(EVX[i],EVY[i],EVZ[i]);
    if(t===EV_HIT||t===EV_KILL||t===EV_CHARGE){ melee+=w; meleeW2+=w*w; }
    if(t===EV_FIRE){ AUD.volley+=w; AUD.volleyW+=w*w; AUD.volleyPan+=w*audPan(EVX[i],EVZ[i]); continue; }
    if(w<0.015) continue;
    const cl=cand[t];
    if(cl.length<2){ cl.push(i); cl.sort((a,b)=>audW(EVX[b],EVY[b],EVZ[b])-audW(EVX[a],EVY[a],EVZ[a])); }
    else if(w>audW(EVX[cl[1]],EVY[cl[1]],EVZ[cl[1]])){ cl[1]=i; cl.sort((a,b)=>audW(EVX[b],EVY[b],EVZ[b])-audW(EVX[a],EVY[a],EVZ[a])); }
  }
  for(let t=0;t<EV_N;t++){ const cl=cand[t];
    for(let j=0;j<cl.length&&AUD.tok[t]>=1;j++){ const i=cl[j]; AUD.tok[t]-=1; const w=audW(EVX[i],EVY[i],EVZ[i]);
      audVoice(t,w,audPan(EVX[i],EVZ[i]), t===EV_FIRE+2? AR()*0.07 : AR()*0.02); } }
  // arrow volleys: many bows loosing together become one swelling whoosh
  AUD.volleyT-=dt;
  if(AUD.volley>0.04 && AUD.volleyT<=0){ const v=AUD.volley, w=AUD.volleyW/v;
    audPlay(AUD.B.whoosh,clamp(0.12+0.3*Math.sqrt(v),0,0.75),AUD.volleyPan/v,1,1500+14000*Math.pow(w,1.2),0.1+0.4*(1-w));

  const dinW=melee>0?meleeW2/melee:0;
  AUD.sampleT-=dt;
  if(AUD.sampleT<=0){ AUD.sampleT=0.2; let hw=0,mw=0;
    if(active && speed>0) for(let i=0;i<N;i++){ if(SS[i]!==1&&SS[i]!==2) continue; const v2=VX[i]*VX[i]+VZ[i]*VZ[i]; if(v2<0.8) continue; const cls=UNITS[TY[i]].cls;
      if(cls==='cav'){ if(v2>4) hw+=audW(PX[i],PY[i],PZ[i]); } else if(cls!=='sie') mw+=audW(PX[i],PY[i],PZ[i]); }

function drawMinimap(){
  if(!MINI.base) return;
  const w=MINI.w, h=MINI.h, d=MINI.buf.data; d.set(MINI.base.data);
  const sx=w/(X1-X0), sz=h/(Z1-Z0);
  const C=[[85,140,255],[255,90,70]];
  for(let i=0;i<N;i++){ const s=SS[i]; if(s!==1&&s!==2) continue; const px=((PX[i]-X0)*sx)|0, pz=((PZ[i]-Z0)*sz)|0; if(px<0||pz<0||px>=w-1||pz>=h-1) continue; const c=C[TM[i]];
    for(const o of [(pz*w+px)*4,(pz*w+px+1)*4,((pz+1)*w+px)*4]){ d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; } }
  MINI.ctx.putImageData(MINI.buf,0,0);
  // camera footprint
  if(RENDER==='gpu'){
    const pts=[[0,0],[CAM.W,0],[CAM.W,CAM.H],[0,CAM.H]].map(p=>{ const r=screenRay(p[0],p[1]); let q=rayPlane(r,0); if(!q){ const t=600; q=[r.o[0]+r.d[0]*t,r.o[2]+r.d[2]*t]; } return q; });
    const ctx=MINI.ctx; ctx.strokeStyle='rgba(255,236,190,0.9)'; ctx.lineWidth=1.5; ctx.beginPath();
    pts.forEach((q,k)=>{ const x=(clamp(q[0],X0-200,X1+200)-X0)*sx, y=(clamp(q[1],Z0-200,Z1+200)-Z0)*sz; if(k) ctx.lineTo(x,y); else ctx.moveTo(x,y); }); ctx.closePath(); ctx.stroke();
  }
}

const stage=$('#stage'), PTR=new Map(); let GST=null;
function spos(e){ const r=stage.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function r2dToWorld(sx,sy){ const s=CAM.H/(CAM.dist*0.9+20), sn=Math.sin(CAM.yaw), cs=Math.cos(CAM.yaw); const u=(sx-CAM.W/2)/s, v=(sy-CAM.H/2)/s; return [CAM.tx+u*sn+v*cs, CAM.tz-u*cs+v*sn]; }
function worldAt(x,y){ return RENDER==='2d'?r2dToWorld(x,y):rayGround(screenRay(x,y)); }
function worldAtPlane(x,y,h){ if(RENDER==='2d') return r2dToWorld(x,y); return rayPlane(screenRay(x,y),h)||rayGround(screenRay(x,y)); }
function snapCam(){ CAM.tx=CAM.g.tx; CAM.tz=CAM.g.tz; CAM.yaw=CAM.g.yaw; CAM.pitch=CAM.g.pitch; CAM.dist=CAM.g.dist; computeView(); }
stage.addEventListener('pointerdown',e=>{
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  const p=spos(e); PTR.set(e.pointerId,{p,start:p,t:performance.now()});
  closePops();
  if(PTR.size===1) beginSingle(e,p); else if(PTR.size===2){ cancelSingle(); beginPinch(); }
  e.preventDefault();
});
let HOVER=null, HOVER_T=0;

stage.addEventListener('pointermove',e=>{ HOVER=spos(e); HOVER_T=performance.now(); const o=PTR.get(e.pointerId); if(!o) return; o.p=spos(e); if(PTR.size>=2) movePinch(); else moveSingle(o.p); });
function pointerUp(e){
  const o=PTR.get(e.pointerId); if(!o) return; PTR.delete(e.pointerId);
  if(GST&&GST.kind==='pinch'){ GST=null; if(PTR.size===1){ const q=[...PTR.values()][0]; q.start=q.p; q.t=0; beginPan(q.p); } return; }
  endSingle(o);
}
stage.addEventListener('pointerup',pointerUp); stage.addEventListener('pointercancel',pointerUp);
stage.addEventListener('contextmenu',e=>e.preventDefault());

function beginSingle(e,p){
  if(e.button===2||(e.button===0&&e.altKey)){ GST={kind:'orbit',last:p}; CAM.follow=-1; return; }
  if(e.button===1){ beginPan(p); return; }
  if(GAME.phase==='deploy'){
    const W=worldAt(p[0],p[1]);
    if(W && D.terrain){ GST={kind:'terrain'}; terrainBegin(W); return; }
    if(W){ const gi=pickGroup(W);
      if(gi>=0){ const g=D.groups[gi]; if(e.shiftKey||e.ctrlKey||e.metaKey){ selectGroup(gi,true); return; } if(!D.selObj.has(g)) selectGroup(gi); pushUndo(); GST={kind:'move',last:W,gi}; return; }
      if(e.shiftKey||e.ctrlKey||e.metaKey){ GST={kind:'box',a:p,b:p,add:true}; return; } }
  }
  if(GAME.phase==='battle' && (BSELMODE||e.shiftKey) && e.button===0){ GST={kind:'box',a:p,b:p,add:e.shiftKey}; return; }

function beginPan(p){ GST={kind:'pan',W0:worldAtPlane(p[0],p[1],CAM.ty),h:CAM.ty}; CAM.follow=-1; if(GAME.phase==='battle') document.querySelectorAll('#camSeg [data-cam]').forEach(x=>x.classList.remove('on')); }
function moveSingle(p){
  if(!GST) return;
  if(GST.kind==='orbit'){ const dx=p[0]-GST.last[0], dy=p[1]-GST.last[1]; GST.last=p; CAM.g.yaw-=dx*0.006; CAM.g.pitch=clamp(CAM.g.pitch+dy*0.005,0.12,1.47); snapCam(); }
  else if(GST.kind==='pan'){ if(!GST.W0) return; const W=worldAtPlane(p[0],p[1],GST.h); if(!W) return; CAM.g.tx+=GST.W0[0]-W[0]; CAM.g.tz+=GST.W0[1]-W[1]; camClamp(CAM.g); snapCam(); }
  else if(GST.kind==='tool'){ const W=worldAt(p[0],p[1]); if(W) toolMove(W); }
  else if(GST.kind==='terrain'){ const W=worldAt(p[0],p[1]); if(W) terrainPaint(W); }
  else if(GST.kind==='move'){ const W=worldAt(p[0],p[1]); if(W){ moveGroup(GST.gi,W[0]-GST.last[0],W[1]-GST.last[1]); GST.last=W; } }
  else if(GST.kind==='box'){ GST.b=p; }
}
function endSingle(o){
  const g=GST; GST=null; if(!g) return;

  if(g.kind==='tool') toolEnd(); else if(g.kind==='terrain') terrainEnd(); else if(g.kind==='move') moveEnd(g.gi);
  else if(g.kind==='pan' && moved<8 && dt<450) tap(o.p);
  else if(g.kind==='box'){ if(moved<6) boxTap(o.p,g.add); else boxSelect(g.a,g.b,g.add); }
}
function cancelSingle(){ if(!GST) return; const k=GST.kind; GST=null; if(k==='tool') toolCancel(); else if(k==='terrain') terrainEnd(); else if(k==='move'){ const gi=D.sel; if(D.undo.length){ popUndo(); syncDeploy(); } selectGroup(gi); } }
function beginPinch(){ const ps=[...PTR.values()].map(o=>o.p); const m=[(ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2];
  GST={kind:'pinch',d0:Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1])||1,a0:Math.atan2(ps[1][1]-ps[0][1],ps[1][0]-ps[0][0]),dist0:CAM.g.dist,yaw0:CAM.g.yaw,h:CAM.ty,W0:worldAtPlane(m[0],m[1],CAM.ty)}; CAM.follow=-1; }
function movePinch(){
  if(!GST||GST.kind!=='pinch') return; const ps=[...PTR.values()].slice(0,2).map(o=>o.p);

}
function zoomAt(p,f){ const W0=worldAtPlane(p[0],p[1],CAM.ty); CAM.g.dist=clamp(CAM.g.dist*f,6,CAM_MAX); CAM.follow=-1; snapCam(); if(W0){ const W=worldAtPlane(p[0],p[1],CAM.ty); if(W){ CAM.g.tx+=W0[0]-W[0]; CAM.g.tz+=W0[1]-W[1]; camClamp(CAM.g); snapCam(); } } }
function boxTap(p,add){ const W=worldAt(p[0],p[1]);

const KEYS=new Set();
window.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  const k=e.key.toLowerCase();
  if(k===' '){ if(GAME.phase==='battle'){ e.preventDefault(); setSpeed(GAME.speed?0:GAME.lastSpeed||1); } return; }
  if(GAME.phase==='battle'&&(k==='1'||k==='2'||k==='3'||k==='0')){ setSpeed({0:0,1:1,2:2,3:4}[k]); return; }
  if(k==='f'&&GAME.phase==='deploy'&&$('#modal').hidden){ startBattle(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); undo(); return; }
  if(k==='delete'||k==='backspace'){ deleteSelected(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='a'){ e.preventDefault(); selectAll(); return; }

  if(k==='escape'){ closeModal(); closePops(); if(GAME.phase==='deploy') selectGroup(-1); else setBattleSel([]); inspectUnit(-1); return; }
  KEYS.add(k);
});
window.addEventListener('keyup',e=>KEYS.delete(e.key.toLowerCase()));

function keyCamera(dt){
  if(!KEYS.size) return; let fx=0,fz=0,rot=0;
  if(KEYS.has('w')||KEYS.has('arrowup')) fz+=1; if(KEYS.has('s')||KEYS.has('arrowdown')) fz-=1; if(KEYS.has('a')||KEYS.has('arrowleft')) fx-=1; if(KEYS.has('d')||KEYS.has('arrowright')) fx+=1;
  if(KEYS.has('q')) rot+=1; if(KEYS.has('e')) rot-=1;
  if(!fx&&!fz&&!rot) return; CAM.follow=-1;
  const sp=CAM.g.dist*0.9*dt, fwx=-Math.cos(CAM.g.yaw), fwz=-Math.sin(CAM.g.yaw), rx=Math.sin(CAM.g.yaw), rz=-Math.cos(CAM.g.yaw);
  CAM.g.tx+=(fwx*fz+rx*fx)*sp; CAM.g.tz+=(fwz*fz+rz*fx)*sp; CAM.g.yaw+=rot*dt*1.2; camClamp(CAM.g);
}
